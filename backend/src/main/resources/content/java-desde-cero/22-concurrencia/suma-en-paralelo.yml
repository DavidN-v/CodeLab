title: Suma en paralelo
summary: Reparte un cálculo entre tareas con ExecutorService y Future.
difficulty: MEDIUM
statement: |
  La entrada es `k` seguido de una lista de enteros. Divide la lista en `k` tramos consecutivos lo más iguales posible (los primeros tramos se quedan con un elemento más si la división no es exacta) y suma cada tramo en una **tarea distinta** enviada a un `ExecutorService`.

  Escribe la suma de cada tramo en orden, `Tramo <i>: <suma>` (empezando en 1), y al final `Total: <suma total>`.

  **Ejemplo:** con `k = 3` y los números `1 2 3 4 5 6 7`, los tramos son `[1 2 3]`, `[4 5]` y `[6 7]`.
