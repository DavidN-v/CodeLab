solution: |
  import java.util.ArrayList;
  import java.util.List;
  import java.util.Scanner;
  import java.util.concurrent.ExecutorService;
  import java.util.concurrent.Executors;
  import java.util.concurrent.Future;

  public class Main {
      public static void main(String[] args) throws Exception {
          Scanner entrada = new Scanner(System.in);
          int k = entrada.nextInt();
          List<Integer> numeros = new ArrayList<>();
          while (entrada.hasNextInt()) {
              numeros.add(entrada.nextInt());
          }
          int base = numeros.size() / k;
          int sobran = numeros.size() % k;
          List<Future<Long>> parciales = new ArrayList<>();
          try (ExecutorService ejecutor = Executors.newFixedThreadPool(k)) {
              int inicio = 0;
              for (int i = 0; i < k; i++) {
                  int fin = inicio + base + (i < sobran ? 1 : 0);
                  List<Integer> tramo = numeros.subList(inicio, fin);
                  parciales.add(ejecutor.submit(() -> {
                      long suma = 0;
                      for (int n : tramo) {
                          suma += n;
                      }
                      return suma;
                  }));
                  inicio = fin;
              }
              long total = 0;
              for (int i = 0; i < k; i++) {
                  long suma = parciales.get(i).get();
                  System.out.println("Tramo " + (i + 1) + ": " + suma);
                  total += suma;
              }
              System.out.println("Total: " + total);
          }
      }
  }
hints:
  - 'La idea: parte la lista en `k` trozos seguidos, suma cada trozo en una tarea distinta y junta las sumas al final, en orden.'
  - 'Qué usar: cada tramo tiene `size / k` elementos y los `size % k` primeros uno más; `lista.subList(inicio, fin)` te da el tramo, y `ejecutor.submit(() -> ...)` devuelve un `Future<Long>` con su suma.'
  - 'El plan: con `inicio = 0`, en cada vuelta calcula `fin = inicio + base + (i < sobran ? 1 : 0)`, envía una tarea que sume `numeros.subList(inicio, fin)`, guarda su `Future` en una lista y haz `inicio = fin`. Después recorre los `Future` en orden con `get()`, imprime cada tramo y acumula el total.'
tests:
  - input: "3\n1 2 3 4 5 6 7\n"
    output: |
      Tramo 1: 6
      Tramo 2: 9
      Tramo 3: 13
      Total: 28
    sample: true
  - input: "2\n10 -10 5 5\n"
    output: |
      Tramo 1: 0
      Tramo 2: 10
      Total: 10
  - input: "4\n1 1 1 1 1\n"
    output: |
      Tramo 1: 2
      Tramo 2: 1
      Tramo 3: 1
      Tramo 4: 1
      Total: 5
