                  return false;
              }
          }
          return true;
      }

      public static void main(String[] args) throws Exception {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();
          int t = entrada.nextInt();

      }
  }
solution: |
  import java.util.ArrayList;
  import java.util.List;
  import java.util.Scanner;
  import java.util.concurrent.Callable;
  import java.util.concurrent.ExecutorService;
  import java.util.concurrent.Executors;
  import java.util.concurrent.Future;

  public class Main {
      static boolean esPrimo(int n) {
          if (n < 2) {
              return false;
          }
          for (int d = 2; (long) d * d <= n; d++) {
              if (n % d == 0) {
                  return false;
              }
          }
          return true;
      }

      public static void main(String[] args) throws Exception {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();
          int t = entrada.nextInt();
          List<Callable<Integer>> tareas = new ArrayList<>();
          int[][] intervalos = new int[t][2];
          for (int i = 1; i <= t; i++) {
              int desde = (int) ((long) (i - 1) * n / t) + 1;
              int hasta = (int) ((long) i * n / t);
              intervalos[i - 1] = new int[] {desde, hasta};
              tareas.add(() -> {
                  int cuenta = 0;
                  for (int x = desde; x <= hasta; x++) {
                      if (esPrimo(x)) {
                          cuenta++;
                      }
                  }
                  return cuenta;
              });
          }
          try (ExecutorService ejecutor = Executors.newFixedThreadPool(Math.min(t, 4))) {
              List<Future<Integer>> resultados = ejecutor.invokeAll(tareas);
              int total = 0;
              for (int i = 0; i < t; i++) {
                  int cuenta = resultados.get(i).get();
                  System.out.println("Tarea " + (i + 1) + " [" + intervalos[i][0] + "-" + intervalos[i][1] + "]: " + cuenta);
                  total += cuenta;
              }
              System.out.println("Total: " + total);
          }
      }
  }
hints:
  - "El intervalo de la tarea `i` empieza en `(i-1)·n/t + 1` y termina en `i·n/t`. Usa `long` para que la multiplicación no se desborde."
  - Las variables que captura la lambda deben ser efectivamente finales, así que calcula `desde` y `hasta` dentro del bucle, en variables nuevas en cada vuelta.
  - "`invokeAll` devuelve los `Future` en el mismo orden que la lista de tareas."
tests:
  - input: "100 4\n"
    output: |
      Tarea 1 [1-25]: 9
      Tarea 2 [26-50]: 6
      Tarea 3 [51-75]: 6
      Tarea 4 [76-100]: 4
      Total: 25
    sample: true
  - input: "10 3\n"
    output: |
      Tarea 1 [1-3]: 2
      Tarea 2 [4-6]: 1
      Tarea 3 [7-10]: 1
      Total: 4
  - input: "1000000 4\n"
    output: |
      Tarea 1 [1-250000]: 22044
      Tarea 2 [250001-500000]: 19494
      Tarea 3 [500001-750000]: 18700
      Tarea 4 [750001-1000000]: 18260
      Total: 78498
