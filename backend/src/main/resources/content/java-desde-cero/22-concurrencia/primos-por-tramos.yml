title: Contar primos por tramos
summary: Un cálculo pesado repartido entre varias tareas que devuelven su resultado.
difficulty: HARD
statement: |
  La entrada es `n t`. Cuenta los números primos entre 1 y `n` repartiendo el trabajo en `t` tareas: la tarea `i` (desde 1) revisa los números del intervalo `((i-1)·n/t, i·n/t]` (división entera).

  Usa un `ExecutorService` e `invokeAll` (o `submit`). Ninguna tarea debe modificar datos compartidos: cada una **devuelve** su cuenta.

  Escribe `Tarea <i> [<desde>-<hasta>]: <primos>` para cada tarea en orden, y después `Total: <primos>`.
