title: Palabras de corta a larga
summary: Arregla un comparador escrito con una lambda.
difficulty: EASY
kind: fix
statement: |
  Este programa lee una línea de palabras y debería escribirlas ordenadas **de la más corta a la más larga**. Si dos palabras miden lo mismo, deben ir en **orden alfabético**.

  Por ejemplo, con `sol estrella luna mar sal` debería escribir:

  ```
  [mar, sal, sol, luna, estrella]
  ```

  Pero al ejecutarlo, la lista sale justo al revés. Encuentra qué falla en la lambda y arréglalo.
starter: |
  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.List;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<String> palabras = new ArrayList<>(Arrays.asList(entrada.nextLine().trim().split("\\s+")));
          palabras.sort((a, b) -> {
              if (a.length() != b.length()) {
                  return b.length() - a.length();
              }
              return b.compareTo(a);
          });
          System.out.println(palabras);
      }
  }
solution: |
  import java.util.ArrayList;
  import java.util.Arrays;
  import java.util.List;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<String> palabras = new ArrayList<>(Arrays.asList(entrada.nextLine().trim().split("\\s+")));
          palabras.sort((a, b) -> {
              if (a.length() != b.length()) {
                  return a.length() - b.length();
              }
              return a.compareTo(b);
          });
          System.out.println(palabras);
      }
  }
hints:
  - 'La idea: un comparador devuelve un número negativo si `a` debe ir antes que `b`; si das la vuelta a la resta, das la vuelta al orden.'
  - 'Qué usar: `a.length() - b.length()` es negativo cuando `a` es más corta, y `a.compareTo(b)` es negativo cuando `a` va antes en el alfabeto.'
  - 'El plan: hay dos líneas con `b` delante de `a`; cambia ambas para que `a` vaya primero: `return a.length() - b.length();` y `return a.compareTo(b);`.'
tests:
  - input: "sol estrella luna mar sal\n"
    output: |
      [mar, sal, sol, luna, estrella]
    sample: true
  - input: "pera uva kiwi higo\n"
    output: |
      [uva, higo, kiwi, pera]
  - input: "bb aa c\n"
    output: |
      [c, aa, bb]
  - input: "hola\n"
    output: |
      [hola]
