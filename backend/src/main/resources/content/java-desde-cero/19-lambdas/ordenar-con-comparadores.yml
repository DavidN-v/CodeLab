title: Ranking de jugadores
summary: Construye comparadores con referencias a métodos y criterios de desempate.
difficulty: MEDIUM
statement: |
  Cada línea describe un jugador: `<nombre> <puntos> <partidas>`. Modela el jugador con un `record` y ordena la lista con `Comparator.comparing(...)`, referencias a métodos y `thenComparing`:

  1. Más puntos primero.
  2. A igualdad de puntos, menos partidas primero.
  3. Después, por nombre alfabético.

  Escribe el ranking con el formato `<posición>. <nombre> (<puntos> pts, <partidas> partidas)`.
starter: |
