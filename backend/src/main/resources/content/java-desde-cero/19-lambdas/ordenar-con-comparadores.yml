solution: |
  import java.util.ArrayList;
  import java.util.Comparator;
  import java.util.List;
  import java.util.Scanner;

  record Jugador(String nombre, int puntos, int partidas) {}

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<Jugador> jugadores = new ArrayList<>();
          while (entrada.hasNext()) {
              jugadores.add(new Jugador(entrada.next(), entrada.nextInt(), entrada.nextInt()));
          }
          jugadores.sort(Comparator.comparing(Jugador::puntos)
              .reversed()
              .thenComparing(Jugador::partidas)
              .thenComparing(Jugador::nombre));
          for (int i = 0; i < jugadores.size(); i++) {
              Jugador j = jugadores.get(i);
              System.out.println((i + 1) + ". " + j.nombre() + " (" + j.puntos() + " pts, " + j.partidas() + " partidas)");
          }
      }
  }
hints:
  - "`Comparator.comparing(Jugador::puntos).reversed()` ordena de más a menos puntos."
  - "Encadena después `.thenComparing(Jugador::partidas)` y `.thenComparing(Jugador::nombre)`."
tests:
  - input: |
      Ada 30 10
      Grace 45 12
      Alan 30 8
      Linus 30 8
    output: |
      1. Grace (45 pts, 12 partidas)
      2. Alan (30 pts, 8 partidas)
      3. Linus (30 pts, 8 partidas)
      4. Ada (30 pts, 10 partidas)
    sample: true
  - input: |
      Solo 0 0
    output: |
      1. Solo (0 pts, 0 partidas)
