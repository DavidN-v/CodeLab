title: Rectángulo
summary: Constructor con validación, sobrecarga y métodos de consulta.
difficulty: EASY
statement: |
  Escribe una clase `Rectangulo` con:

  - Dos campos privados y `final`, `ancho` y `alto`.
  - Un constructor `Rectangulo(int ancho, int alto)`.
  - Un constructor `Rectangulo(int lado)` que cree un cuadrado (usa `this(...)`).
  - Métodos `int area()`, `int perimetro()` y `boolean esCuadrado()`.

  La entrada tiene uno o dos números. Con uno, crea un cuadrado; con dos, un rectángulo. Escribe:

  ```
  Área: <área>
  Perímetro: <perímetro>
  Cuadrado: <true|false>
  ```
