solution: |
  import java.util.Scanner;

  class Rectangulo {
      private final int ancho;
      private final int alto;

      Rectangulo(int ancho, int alto) {
          this.ancho = ancho;
          this.alto = alto;
      }

      Rectangulo(int lado) {
          this(lado, lado);
      }

      int area() {
          return ancho * alto;
      }

      int perimetro() {
          return 2 * (ancho + alto);
      }

      boolean esCuadrado() {
          return ancho == alto;
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int primero = entrada.nextInt();
          Rectangulo r;
          if (entrada.hasNextInt()) {
              int segundo = entrada.nextInt();
              r = new Rectangulo(primero, segundo);
          } else {
              r = new Rectangulo(primero);
          }
          System.out.println("Área: " + r.area());
          System.out.println("Perímetro: " + r.perimetro());
          System.out.println("Cuadrado: " + r.esCuadrado());
      }
  }
hints:
  - "El constructor de un lado puede delegar en el otro: `this(lado, lado);`."
  - "`esCuadrado` puede devolver directamente la comparación `ancho == alto`."
