solution: |
  import java.util.Scanner;

  class Fraccion {
      private final int numerador;
      private final int denominador;

      Fraccion(int numerador, int denominador) {
          if (denominador == 0) {
              throw new IllegalArgumentException("denominador cero");
          }
          if (denominador < 0) {
              numerador = -numerador;
              denominador = -denominador;
          }
          int divisor = mcd(Math.abs(numerador), denominador);
          this.numerador = numerador / divisor;
          this.denominador = denominador / divisor;
      }

      Fraccion sumar(Fraccion otra) {
          return new Fraccion(numerador * otra.denominador + otra.numerador * denominador,
                  denominador * otra.denominador);
      }

      Fraccion multiplicar(Fraccion otra) {
          return new Fraccion(numerador * otra.numerador, denominador * otra.denominador);
      }

      String texto() {
          return denominador == 1 ? String.valueOf(numerador) : numerador + "/" + denominador;
      }

      private static int mcd(int a, int b) {
          return b == 0 ? Math.max(a, 1) : mcd(b, a % b);
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int a = entrada.nextInt();
          int b = entrada.nextInt();
          String op = entrada.next();
          int c = entrada.nextInt();
          int d = entrada.nextInt();
          try {
              Fraccion x = new Fraccion(a, b);
              Fraccion y = new Fraccion(c, d);
              Fraccion resultado = op.equals("+") ? x.sumar(y) : x.multiplicar(y);
              System.out.println(resultado.texto());
          } catch (IllegalArgumentException e) {
              System.out.println("Error: denominador cero");
          }
      }
  }
hints:
  - 'La idea: si simplificas al crear la fracción, todas las fracciones (también las que devuelven `sumar` y `multiplicar`) salen ya simplificadas.'
  - 'Qué usar: el máximo común divisor con el algoritmo de Euclides (`mcd(a, b) = mcd(b, a % b)` y `mcd(a, 0) = a`), `throw new IllegalArgumentException(...)` y un `try`/`catch` en el `main`.'
  - 'El plan: en el constructor, si el denominador es 0 lanza la excepción; si es negativo, cambia el signo de los dos; divide ambos por el mcd. `a/b + c/d = (a·d + c·b) / (b·d)` y `a/b · c/d = (a·c) / (b·d)`.'
tests:
  - input: "1 2 + 1 3\n"
    output: "5/6\n"
    sample: true
  - input: "2 4 * 6 3\n"
    output: "1\n"
    sample: true
  - input: "1 -2 + 0 5\n"
    output: "-1/2\n"
  - input: "3 4 + 1 4\n"
    output: "1\n"
  - input: "1 0 + 1 2\n"
    output: "Error: denominador cero\n"
  - input: "-2 3 * -3 4\n"
    output: "1/2\n"
