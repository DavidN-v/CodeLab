title: Fracciones
summary: Una clase inmutable que siempre se guarda simplificada.
difficulty: HARD
statement: |
  Crea una clase inmutable `Fraccion` con numerador y denominador enteros que:

  - Se guarde **siempre simplificada** (divide ambos por su máximo común divisor) y con el signo en el numerador (el denominador siempre positivo).
  - Lance `IllegalArgumentException` si el denominador es 0.
  - Tenga `Fraccion sumar(Fraccion otra)` y `Fraccion multiplicar(Fraccion otra)`, que devuelven fracciones **nuevas**.
  - Tenga `String texto()` que devuelva `n/d`, o solo `n` si el denominador es 1.

  La entrada es `a b op c d` y representa `a/b op c/d`, con `op` igual a `+` o `*`. Escribe el resultado con `texto()`. Si algún denominador es 0, escribe `Error: denominador cero`.

  **Ejemplos:** `1 2 + 1 3` → `5/6`; `2 4 * 6 3` → `1`; `1 -2 + 0 5` → `-1/2`.
