title: Numerador de tickets
summary: Un campo static que comparten todos los objetos.
difficulty: MEDIUM
statement: |
  En una panadería cada cliente saca un ticket numerado. Crea una clase `Ticket` que:

  - Asigne a cada ticket nuevo el siguiente número, empezando en 1, usando un contador `static`.
  - Guarde el nombre del cliente.
  - Tenga `String texto()` que devuelva `Ticket <número>: <nombre>`.
  - Tenga un método `static int emitidos()` con el total de tickets creados.

  La entrada es una lista de nombres, uno por línea. Escribe el texto de cada ticket y, al final, `Emitidos: <total>`.
