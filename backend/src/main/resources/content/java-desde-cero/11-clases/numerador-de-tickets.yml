solution: |
  import java.util.Scanner;

  class Ticket {
      private static int ultimoNumero = 0;
      private final int numero;
      private final String cliente;

      Ticket(String cliente) {
          ultimoNumero++;
          this.numero = ultimoNumero;
          this.cliente = cliente;
      }

      String texto() {
          return "Ticket " + numero + ": " + cliente;
      }

      static int emitidos() {
          return ultimoNumero;
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          while (entrada.hasNextLine()) {
              String nombre = entrada.nextLine();
              System.out.println(new Ticket(nombre).texto());
          }
          System.out.println("Emitidos: " + Ticket.emitidos());
      }
  }
hints:
  - Un campo `private static int` es compartido por todos los tickets; increméntalo en el constructor.
  - Copia su valor a un campo de instancia `numero` para que cada ticket recuerde el suyo.
tests:
  - input: |
      Ada
      Grace
      Alan
    output: |
      Ticket 1: Ada
      Ticket 2: Grace
      Ticket 3: Alan
      Emitidos: 3
    sample: true
  - input: |
      Linus
    output: |
      Ticket 1: Linus
      Emitidos: 1
