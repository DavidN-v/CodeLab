title: Nómina polimórfica
summary: Calcula el coste de una plantilla con tipos de contrato distintos.
difficulty: MEDIUM
statement: |
  Una empresa tiene tres tipos de trabajador, todos con un nombre y un método `int pagoMensual()`:

  - `Fijo <nombre> <sueldo>`: cobra su sueldo.
  - `PorHoras <nombre> <horas> <precioHora>`: cobra horas × precio; las horas que pasen de 160 se pagan al doble.
  - `Comercial <nombre> <base> <ventas>`: cobra la base más el 5 % de sus ventas (división entera).

  Diseña una clase abstracta `Trabajador` y las tres subclases. La entrada tiene una línea por trabajador (el primer dato es el tipo, tal cual aparece arriba). Escribe `<nombre>: <pago>` por cada uno, en orden, y al final `Total: <suma>` y `Mayor: <nombre del que más cobra>` (si empatan, el primero).
