title: Coro de animales
summary: Un array del tipo padre y una llamada que cada objeto resuelve a su manera.
difficulty: EASY
statement: |
  La clase abstracta `Animal` tiene un nombre y un método abstracto `String sonido()`, y un método `String cantar()` que devuelve `"<nombre> hace <sonido>"`.

  Crea las subclases `Perro` (`guau`), `Gato` (`miau`), `Vaca` (`muu`) y `Pato` (`cuac`).

  La entrada tiene líneas `<tipo> <nombre>` (con el tipo en minúsculas). El `main` guarda los animales en una lista y después imprime lo que canta cada uno.
starter: |
