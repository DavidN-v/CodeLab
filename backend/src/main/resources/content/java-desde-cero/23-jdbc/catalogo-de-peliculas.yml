solution: |
  import java.sql.Connection;
  import java.sql.DriverManager;
  import java.sql.PreparedStatement;
  import java.sql.ResultSet;
  import java.sql.SQLException;
  import java.sql.Statement;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) throws SQLException {
          Scanner entrada = new Scanner(System.in);
          try (Connection c = DriverManager.getConnection("jdbc:h2:mem:cine")) {
              try (Statement s = c.createStatement()) {
                  s.execute("CREATE TABLE peliculas (titulo VARCHAR(100), anio INT, puntuacion INT)");
              }
              try (PreparedStatement insertar = c.prepareStatement("INSERT INTO peliculas VALUES (?, ?, ?)")) {
                  while (entrada.hasNextLine()) {
                      String[] partes = entrada.nextLine().split(";");
                      insertar.setString(1, partes[0]);
                      insertar.setInt(2, Integer.parseInt(partes[1].trim()));
                      insertar.setInt(3, Integer.parseInt(partes[2].trim()));
                      insertar.executeUpdate();
                  }
              }
              try (Statement s = c.createStatement()) {
                  try (ResultSet r = s.executeQuery(
                          "SELECT titulo, anio, puntuacion FROM peliculas WHERE puntuacion >= 7 ORDER BY puntuacion DESC, anio")) {
                      while (r.next()) {
                          System.out.println(r.getString("titulo") + " (" + r.getInt("anio") + ") - " + r.getInt("puntuacion"));
                      }
                  }
                  try (ResultSet r = s.executeQuery("SELECT COUNT(*) FROM peliculas")) {
                      r.next();
                      System.out.println("Total: " + r.getInt(1));
                  }
              }
          }
      }
  }
hints:
  - "Crea la tabla con `statement.execute(\"CREATE TABLE ...\")`."
  - Un único `PreparedStatement` de inserción se reutiliza en cada vuelta cambiando los parámetros.
  - "`ORDER BY puntuacion DESC, anio` ordena por dos criterios."
tests:
  - input: |
      Amélie;2001;8
      Coco;2017;9
      Avatar;2009;7
      Mala;2010;3
      Up;2009;9
    output: |
      Up (2009) - 9
      Coco (2017) - 9
      Amélie (2001) - 8
      Avatar (2009) - 7
      Total: 5
    sample: true
  - input: |
      Ninguna buena;2020;2
    output: |
      Total: 1
