title: Catálogo de películas
summary: Crea una tabla, inserta datos con PreparedStatement y consulta ordenando.
difficulty: EASY
statement: |
  Cada línea de la entrada es una película: `<título>;<año>;<puntuación>` (puntuación entera de 1 a 10). El programa debe:

  1. Crear en H2 en memoria (`jdbc:h2:mem:cine`) una tabla `peliculas (titulo VARCHAR(100), anio INT, puntuacion INT)`.
  2. Insertar cada película con un `PreparedStatement`.
  3. Con **una consulta SQL**, escribir las películas con puntuación de 7 o más, ordenadas por puntuación descendente y, a igualdad, por año ascendente: `<título> (<año>) - <puntuación>`.
  4. Con otra consulta, escribir `Total: <número de películas>`.
