title: Clientes por ciudad
summary: groupingBy con un mapa ordenado y colectores aguas abajo.
difficulty: HARD
statement: |
  Cada línea es un cliente: `<nombre>,<ciudad>,<gasto>` (gasto entero). Usando `Collectors.groupingBy`, escribe para cada ciudad, en orden alfabético:

  ```
  <ciudad>: <número de clientes> clientes, <gasto total> €, mejor: <cliente que más gasta>
  ```

  y a continuación, en otra línea, los nombres de los clientes de esa ciudad ordenados alfabéticamente, con sangría de dos espacios y separados por `, `.

  Si dos clientes de una ciudad empatan en gasto, el "mejor" es el que va antes alfabéticamente.
