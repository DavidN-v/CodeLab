title: Completa la tubería
summary: Rellena los huecos de un stream con filter, map y toList.
difficulty: EASY
kind: fill
statement: |
  El programa lee una línea de números enteros y debe escribir **los cuadrados de los números pares**, ordenados de menor a mayor.

  Por ejemplo, con `3 4 1 6 2` los pares son 4, 6 y 2; sus cuadrados, 16, 36 y 4; ordenados:

  ```
  [4, 16, 36]
  ```

  Completa los tres huecos de la tubería: quedarse con los pares, elevar al cuadrado y recoger en una lista.
