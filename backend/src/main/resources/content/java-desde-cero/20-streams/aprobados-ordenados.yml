solution: |
  import java.util.ArrayList;
  import java.util.Comparator;
  import java.util.List;
  import java.util.Scanner;
  import java.util.stream.Collectors;

  record Alumno(String nombre, double nota) {}

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<Alumno> alumnos = new ArrayList<>();
          while (entrada.hasNext()) {
              alumnos.add(new Alumno(entrada.next(), entrada.nextDouble()));
          }
          List<Alumno> aprobados = alumnos.stream()
              .filter(a -> a.nota() >= 5)
              .sorted(Comparator.comparing(Alumno::nota).reversed().thenComparing(Alumno::nombre))
              .toList();
          System.out.println(aprobados.isEmpty() ? "Ninguno"
                  : aprobados.stream().map(Alumno::nombre).collect(Collectors.joining(", ")));
          System.out.println(aprobados.isEmpty() ? "Media de aprobados: -"
                  : String.format("Media de aprobados: %.2f",
                          aprobados.stream().mapToDouble(Alumno::nota).average().orElse(0)));
      }
  }
hints:
  - "`filter(a -> a.nota() >= 5)` y después `sorted(...)` con un comparador que use `reversed()` y `thenComparing`."
  - "`Collectors.joining(\", \")` une los nombres; `mapToDouble(Alumno::nota).average()` da la media."
tests:
  - input: |
      Ada 9.5
      Alan 4.9
      Grace 7
      Linus 7
      Barbara 5
    output: |
      Ada, Grace, Linus, Barbara
      Media de aprobados: 7.13
    sample: true
  - input: |
      Uno 2
      Dos 3.5
    output: |
      Ninguno
      Media de aprobados: -
