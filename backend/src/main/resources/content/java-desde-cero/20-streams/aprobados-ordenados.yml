title: Aprobados ordenados
summary: filter, sorted y map en una sola tubería.
difficulty: EASY
statement: |
  Cada línea de la entrada es `<nombre> <nota>` (nota decimal). Usando **un stream**, escribe en una sola línea los nombres de los aprobados (nota ≥ 5), ordenados de mayor a menor nota y, a igual nota, por nombre alfabético, separados por `, `. Si no hay aprobados, escribe `Ninguno`.

  Debajo, escribe `Media de aprobados: <media>` con dos decimales (o `Media de aprobados: -` si no hay).
