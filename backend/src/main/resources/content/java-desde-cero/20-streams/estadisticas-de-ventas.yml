title: Estadísticas de ventas
summary: Streams numéricos, max con comparador y Optional.
difficulty: MEDIUM
statement: |
  Cada línea es una venta: `<producto> <unidades> <precioUnitario>`. Con streams, calcula y escribe:

  ```
  Ventas: <número de líneas>
  Unidades: <total de unidades>
  Ingresos: <total de unidades × precio, con 2 decimales>
  Más vendido: <producto con más unidades en una sola venta>
  Ticket medio: <ingresos / número de ventas, con 2 decimales>
  ```

  Si hay empate en "más vendido", el que aparezca primero. Si no hay ventas, escribe solo `Sin ventas`.
