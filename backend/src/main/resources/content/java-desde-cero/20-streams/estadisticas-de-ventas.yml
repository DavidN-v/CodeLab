solution: |
  import java.util.ArrayList;
  import java.util.Comparator;
  import java.util.List;
  import java.util.Scanner;

  record Venta(String producto, int unidades, double precio) {
      double importe() {
          return unidades * precio;
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<Venta> ventas = new ArrayList<>();
          while (entrada.hasNext()) {
              ventas.add(new Venta(entrada.next(), entrada.nextInt(), entrada.nextDouble()));
          }
          if (ventas.isEmpty()) {
              System.out.println("Sin ventas");
              return;
          }
          int unidades = ventas.stream().mapToInt(Venta::unidades).sum();
          double ingresos = ventas.stream().mapToDouble(Venta::importe).sum();
          String masVendido = ventas.stream()
              .reduce((mejor, otra) -> otra.unidades() > mejor.unidades() ? otra : mejor)
              .map(Venta::producto)
              .orElse("-");
          System.out.println("Ventas: " + ventas.size());
          System.out.println("Unidades: " + unidades);
          System.out.printf("Ingresos: %.2f%n", ingresos);
          System.out.println("Más vendido: " + masVendido);
          System.out.printf("Ticket medio: %.2f%n", ingresos / ventas.size());
      }
  }
hints:
  - "`mapToInt(Venta::unidades).sum()` y `mapToDouble(Venta::importe).sum()` dan los totales."
  - "`max(Comparator.comparingInt(Venta::unidades))` funciona, pero en un empate no garantiza quedarse con el primero; un `reduce` que solo cambie si la otra venta es estrictamente mayor sí lo hace."
tests:
  - input: |
      café 3 1.50
      té 1 1.20
      zumo 5 2.80
      café 5 1.50
    output: |
      Ventas: 4
      Unidades: 14
      Ingresos: 27.20
      Más vendido: zumo
      Ticket medio: 6.80
    sample: true
  - input: ""
    output: |
      Sin ventas
