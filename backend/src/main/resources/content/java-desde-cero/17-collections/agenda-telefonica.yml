title: Agenda telefónica
summary: Un Map ordenado con altas, bajas, búsquedas y listados.
difficulty: MEDIUM
statement: |
  Implementa una agenda con un `TreeMap<String, String>` de nombre a teléfono. Órdenes, una por línea:

  - `alta <nombre> <telefono>`: añade o actualiza. Escribe `Añadido` o `Actualizado`.
  - `baja <nombre>`: escribe `Eliminado` o `No existe`.
  - `buscar <nombre>`: escribe el teléfono o `No existe`.
  - `prefijo <texto>`: escribe, en orden alfabético, los contactos cuyo nombre empieza por ese texto con el formato `<nombre>: <teléfono>`, o `Sin resultados`.
  - `listar`: escribe todos los contactos en orden alfabético con el mismo formato, o `Agenda vacía`.

  Los nombres son una sola palabra y se comparan tal cual (distinguiendo mayúsculas).
