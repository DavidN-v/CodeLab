questions:
  - type: output
    prompt: ¿Qué imprime este programa?
    code: |
      import java.util.Map;
      import java.util.TreeMap;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> edades = new TreeMap<>();
              edades.put("Luis", 30);
              edades.put("Ana", 25);
              edades.put("Luis", 31);
              System.out.println(edades);
              System.out.println(edades.getOrDefault("Eva", 0));
          }
      }
    answer: |
      {Ana=25, Luis=31}
      0
    explanation: Poner una clave que ya existe **reemplaza** su valor, así que Luis pasa a 31 y no se duplica. El `TreeMap` muestra las claves en orden alfabético. "Eva" no existe, así que `getOrDefault` devuelve el valor por defecto, 0.
  - type: choice
    prompt: ¿Qué devuelve `mapa.get(clave)` si la clave no existe?
    options:
      - 'null'
      - '0'
      - Lanza una excepción
    answer: 0
    explanation: '`get` devuelve `null` cuando no encuentra la clave. Por eso, para contar, se usa `getOrDefault(clave, 0)` o `merge`.'
  - type: choice
    prompt: Quieres contar cuántas veces aparece cada palabra. ¿Qué línea suma 1 a la cuenta de `palabra`?
    options:
      - cuenta.merge(palabra, 1, Integer::sum);
      - cuenta.put(palabra, 1);
      - cuenta.get(palabra) + 1;
    answer: 0
    explanation: '`merge` pone 1 si la palabra es nueva y, si ya estaba, suma 1. `put(palabra, 1)` la dejaría siempre en 1, y `get(palabra) + 1` calcula el número pero no lo guarda.'
