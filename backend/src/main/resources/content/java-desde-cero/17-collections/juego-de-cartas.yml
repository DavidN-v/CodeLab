solution: |
  import java.util.ArrayList;
  import java.util.HashMap;
  import java.util.List;
  import java.util.Map;
  import java.util.Scanner;

  public class Main {
      static boolean esValida(String carta, Map<String, Integer> valores) {
          if (carta.length() < 2) {
              return false;
          }
          String palo = carta.substring(carta.length() - 1);
          String valor = carta.substring(0, carta.length() - 1);
          return "CDHS".contains(palo) && valores.containsKey(valor);
      }

      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int jugadores = Integer.parseInt(entrada.nextLine().strip());
          String[] baraja = entrada.nextLine().strip().split("\\s+");

          // Paso 1
          Map<String, Integer> valores = new HashMap<>();
          for (int numero = 2; numero <= 10; numero++) {
              valores.put(String.valueOf(numero), numero);
          }
          valores.put("J", 10);
          valores.put("Q", 10);
          valores.put("K", 10);
          valores.put("A", 11);

          // Pasos 2 y 3
          List<List<String>> manos = new ArrayList<>();
          for (int i = 0; i < jugadores; i++) {
              manos.add(new ArrayList<>());
          }
          int repartidas = 0;
          for (String carta : baraja) {
              if (esValida(carta, valores)) {
                  manos.get(repartidas % jugadores).add(carta);
                  repartidas++;
              } else {
                  System.out.println("Carta descartada: " + carta);
              }
          }

          // Paso 4
          List<Integer> puntos = new ArrayList<>();
          int mejor = 0;
          for (int i = 0; i < jugadores; i++) {
              List<String> mano = manos.get(i);
              int total = 0;
              for (String carta : mano) {
                  total += valores.get(carta.substring(0, carta.length() - 1));
              }
              puntos.add(total);
              mejor = Math.max(mejor, total);
              String cartas = mano.isEmpty() ? "sin cartas" : String.join(" ", mano);
              System.out.println("Jugador " + (i + 1) + ": " + cartas + " (" + total + " puntos)");
          }

          // Paso 5
          List<String> ganadores = new ArrayList<>();
          for (int i = 0; i < jugadores; i++) {
              if (puntos.get(i) == mejor) {
                  ganadores.add(String.valueOf(i + 1));
              }
          }
          if (ganadores.size() == 1) {
              System.out.println("Gana el jugador " + ganadores.get(0) + " con " + mejor + " puntos");
          } else {
              System.out.println("Empate a " + mejor + " puntos entre los jugadores " + String.join(", ", ganadores));
          }
      }
  }
hints:
  - 'La idea: es una cadena de pasos pequeños. Primero preparas la tabla de valores, luego separas las cartas buenas de las malas, las repartes por turnos, sumas cada mano y, por último, buscas la puntuación más alta y quién la tiene.'
  - 'Qué usar: un `Map<String, Integer>` para los valores (`containsKey` para validar y `get` para sumar), `substring` para separar valor y palo, una `List<List<String>>` con una lista por jugador, el resto `%` para repartir por turnos y `String.join` para escribir las cartas.'
  - 'El plan: valor = `carta.substring(0, carta.length() - 1)` y palo = la última letra. Lleva un contador `repartidas` de cartas válidas y da cada una a `manos.get(repartidas % jugadores)`. Guarda los puntos de cada jugador en una lista mientras escribes las manos y calcula el máximo. Después recorre esos puntos y junta en otra lista los números de los jugadores que tienen el máximo: si hay uno, gana; si hay más, es empate.'
