title: Las palabras más frecuentes
summary: Cuenta con un Map y ordena sus entradas.
difficulty: MEDIUM
statement: |
  Lee un texto y cuenta cuántas veces aparece cada palabra. Antes de contar, pasa todo a minúsculas y considera palabras las secuencias de letras: sustituye cualquier carácter que no sea letra por un espacio.

  La primera línea de la entrada es un número `k`; el resto es el texto. Escribe las `k` palabras más frecuentes con el formato `<palabra>: <veces>`, de más a menos frecuente y, a igual frecuencia, en orden alfabético. Si hay menos de `k` palabras distintas, escríbelas todas.
