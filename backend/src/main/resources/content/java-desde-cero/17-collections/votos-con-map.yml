title: Recuento de votos
summary: Ordena las líneas que cuentan votos con un Map.
difficulty: EASY
kind: parsons
statement: |
  En una votación de clase, cada palabra de la entrada es el nombre de una persona votada. Ordena las líneas para que el programa cuente los votos de cada nombre y los escriba en orden alfabético con el formato `<nombre>: <votos>`.

  Por ejemplo, con la entrada `Luis Ana Luis` escribe:

  ```
  Ana: 1
  Luis: 2
  ```

  Cuidado: sobra una línea.
