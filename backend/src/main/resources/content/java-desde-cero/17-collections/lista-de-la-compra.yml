title: Lista de la compra
summary: Añade, quita y consulta elementos de un ArrayList.
difficulty: EASY
statement: |
  Gestiona una lista de la compra con órdenes, una por línea:

  - `añadir <producto>`: lo añade al final (puede repetirse).
  - `quitar <producto>`: quita la **primera** aparición; si no está, escribe `No está: <producto>`.
  - `mostrar`: escribe la lista con el formato `[a, b, c]` (el `toString` de `List`).
  - `cuantos`: escribe el número de elementos.

  Los productos son una sola palabra.
