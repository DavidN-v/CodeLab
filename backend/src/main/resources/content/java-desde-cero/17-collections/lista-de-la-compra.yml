solution: |
  import java.util.ArrayList;
  import java.util.List;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          List<String> lista = new ArrayList<>();
          while (entrada.hasNext()) {
              String orden = entrada.next();
              switch (orden) {
                  case "añadir" -> lista.add(entrada.next());
                  case "quitar" -> {
                      String producto = entrada.next();
                      if (!lista.remove(producto)) {
                          System.out.println("No está: " + producto);
                      }
                  }
                  case "mostrar" -> System.out.println(lista);
                  case "cuantos" -> System.out.println(lista.size());
                  default -> { }
              }
          }
      }
  }
hints:
  - 'La idea: lee una orden cada vez y, según cuál sea, cambia la lista o muestra algo de ella.'
  - 'Qué usar: un `switch` sobre la orden y los métodos de `List`. `lista.remove(objeto)` quita la primera aparición y devuelve `true` si lo encontró; `System.out.println(lista)` ya imprime `[a, b, c]`.'
  - 'El plan: `case "añadir" -> lista.add(entrada.next());`, en `"quitar"` guarda el producto y `if (!lista.remove(producto))` escribe `No está: ...`; `"mostrar"` imprime la lista y `"cuantos"` imprime `lista.size()`.'
tests:
  - input: |
      añadir pan
      añadir leche
      añadir pan
      mostrar
      quitar pan
      quitar huevos
      mostrar
      cuantos
    output: |
      [pan, leche, pan]
      No está: huevos
      [leche, pan]
      2
    sample: true
  - input: |
      mostrar
      cuantos
    output: |
      []
      0
