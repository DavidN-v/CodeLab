title: 'Proyecto: boletín de notas'
summary: Construye paso a paso un boletín con calificaciones, media, máxima, mínima y aprobados.
difficulty: HARD
kind: project
statement: |
  Vas a programar el boletín de notas de una clase. Es un proyecto más largo que un ejercicio normal, así que lo construirás **por pasos**. Ejecuta el programa al terminar cada paso para comprobar que vas bien.

  ## La entrada

  Primero llega un entero `n` (al menos 1): el número de alumnos. Después llegan `n` notas entre 0 y 10, con un decimal como mucho (por ejemplo `7.5` o `9`).

  ## La salida

  Para la entrada

  ```
  4
  7.5 4 9.2 5
  ```

  el programa debe escribir **exactamente**:

  ```
  Alumno 1: 7.5 - Notable
  Alumno 2: 4.0 - Suspenso
  Alumno 3: 9.2 - Sobresaliente
  Alumno 4: 5.0 - Aprobado
  Media: 6.43
  Nota más alta: 9.2
  Nota más baja: 4.0
  Aprobados: 3 de 4
  ```

  ## Paso 1: leer las notas

  Lee `n` y crea un array `double[] notas` de tamaño `n`. Llénalo con un bucle. Para leer cada nota usa `Double.parseDouble(entrada.next())`, que entiende el punto decimal (`7.5`).

  ## Paso 2: el método `calificacion`

  Escribe `static String calificacion(double nota)` que devuelva:

  | Nota | Calificación |
  | --- | --- |
  | menos de 5 | `Suspenso` |
  | de 5 a menos de 7 | `Aprobado` |
  | de 7 a menos de 9 | `Notable` |
  | 9 o más | `Sobresaliente` |

  ## Paso 3: listar a los alumnos

  Recorre el array y escribe una línea por alumno: `Alumno <número>: <nota> - <calificación>`. Los alumnos se numeran desde 1 y la nota se escribe con **un** decimal: `System.out.printf("Alumno %d: %.1f - %s%n", ...)`.

  ## Paso 4: la media

  Escribe `static double media(double[] notas)` y muestra `Media: <media>` con **dos** decimales (`%.2f`).

  ## Paso 5: la más alta y la más baja

  Escribe `static double maxima(double[] notas)` y `static double minima(double[] notas)`. Empieza siempre por el primer elemento, `notas[0]`. Escríbelas con un decimal: `Nota más alta: 9.2` y `Nota más baja: 4.0`.

  ## Paso 6: los aprobados

  Escribe `static int contarAprobados(double[] notas)` (aprueba quien tiene 5 o más) y termina con `Aprobados: <aprobados> de <n>`.
