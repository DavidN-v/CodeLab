solution: |
  import java.util.Scanner;

  public class Main {
      static String calificacion(double nota) {
          if (nota < 5) {
              return "Suspenso";
          } else if (nota < 7) {
              return "Aprobado";
          } else if (nota < 9) {
              return "Notable";
          }
          return "Sobresaliente";
      }

      static double media(double[] notas) {
          double suma = 0;
          for (double nota : notas) {
              suma += nota;
          }
          return suma / notas.length;
      }

      static double maxima(double[] notas) {
          double mayor = notas[0];
          for (double nota : notas) {
              if (nota > mayor) {
                  mayor = nota;
              }
          }
          return mayor;
      }

      static double minima(double[] notas) {
          double menor = notas[0];
          for (double nota : notas) {
              if (nota < menor) {
                  menor = nota;
              }
          }
          return menor;
      }

      static int contarAprobados(double[] notas) {
          int aprobados = 0;
          for (double nota : notas) {
              if (nota >= 5) {
                  aprobados++;
              }
          }
          return aprobados;
      }

      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();
          double[] notas = new double[n];
          for (int i = 0; i < n; i++) {
              notas[i] = Double.parseDouble(entrada.next());
          }
          for (int i = 0; i < n; i++) {
              System.out.printf("Alumno %d: %.1f - %s%n", i + 1, notas[i], calificacion(notas[i]));
          }
          System.out.printf("Media: %.2f%n", media(notas));
          System.out.printf("Nota más alta: %.1f%n", maxima(notas));
          System.out.printf("Nota más baja: %.1f%n", minima(notas));
          System.out.println("Aprobados: " + contarAprobados(notas) + " de " + n);
      }
  }
hints:
  - 'La idea: divide el problema en piezas pequeñas. Cada pieza (la calificación, la media, la máxima…) es un método que recibe la nota o el array entero y devuelve una sola respuesta. `main` solo lee y escribe.'
  - 'Qué usar: un `double[]` para las notas, una cadena de `if / else if` en `calificacion`, for-each con acumuladores en los demás métodos, y `printf` con `%.1f` (un decimal) y `%.2f` (dos decimales).'
  - 'El plan: `calificacion` → `if (nota < 5) return "Suspenso"; else if (nota < 7) ...`. `media` → suma todo y divide entre `notas.length`. `maxima` y `minima` → empieza con `notas[0]` y compara. `contarAprobados` → cuenta las `nota >= 5`. En `main`: leer, listar con `i + 1`, y las cuatro líneas del resumen.'
