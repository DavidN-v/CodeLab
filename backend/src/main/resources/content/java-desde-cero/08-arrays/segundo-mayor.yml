title: El segundo mayor
summary: Encuentra el segundo valor distinto más grande en una sola pasada.
difficulty: HARD
statement: |
  Lee `n` y después `n` enteros. Escribe el **segundo mayor valor distinto**. Si no existe (todos los valores son iguales o solo hay uno), escribe `No existe`.

  **Ejemplo:** `6  4 9 2 9 7 1` → `7` (el mayor es 9; el siguiente valor distinto es 7).

  Intenta hacerlo recorriendo el array una sola vez, sin ordenarlo.
