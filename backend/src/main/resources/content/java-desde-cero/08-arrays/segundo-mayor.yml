          for (int i = 0; i < n; i++) {
              valores[i] = entrada.nextInt();
          }

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();
          int[] valores = new int[n];
          for (int i = 0; i < n; i++) {
              valores[i] = entrada.nextInt();
          }
          long mayor = Long.MIN_VALUE;
          long segundo = Long.MIN_VALUE;
          for (int valor : valores) {
              if (valor > mayor) {
                  segundo = mayor;
                  mayor = valor;
              } else if (valor < mayor && valor > segundo) {
                  segundo = valor;
              }
          }
          System.out.println(segundo == Long.MIN_VALUE ? "No existe" : String.valueOf(segundo));
      }
  }
hints:
  - 'La idea: es como un podio con dos puestos. Cuando llega alguien mejor que el campeón, el campeón baja a segundo puesto y el nuevo sube al primero.'
  - 'Qué usar: dos variables, `mayor` y `segundo`, que empiecen con un valor imposible (`Long.MIN_VALUE`) y un solo recorrido del array con `if / else if`.'
  - 'El plan: si `valor > mayor` → `segundo = mayor; mayor = valor;`. Si no, y además `valor < mayor && valor > segundo` → `segundo = valor;`. Al final, si `segundo` sigue en `Long.MIN_VALUE`, escribe `No existe`.'
tests:
  - input: "6\n4 9 2 9 7 1\n"
    output: "7\n"
    sample: true
  - input: "3\n5 5 5\n"
    output: "No existe\n"
    sample: true
  - input: "1\n8\n"
    output: "No existe\n"
  - input: "4\n-1 -7 -3 -1\n"
    output: "-3\n"
  - input: "5\n1 2 3 4 5\n"
    output: "4\n"
  - input: "2\n10 3\n"
    output: "3\n"
