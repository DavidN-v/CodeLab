title: Contar aprobados
summary: Ordena las líneas de un programa que cuenta las notas de 5 o más.
difficulty: EASY
kind: parsons
statement: |
  Ordena las líneas para que el programa lea `n` y después `n` notas enteras (de 0 a 10), las guarde en un array y escriba cuántas son aprobados (nota mayor o igual que 5):

  ```
  Aprobados: <cantidad>
  ```

  Cuidado: sobra una línea.

  **Ejemplo:** `5  7 3 5 9 4` → `Aprobados: 3`.
