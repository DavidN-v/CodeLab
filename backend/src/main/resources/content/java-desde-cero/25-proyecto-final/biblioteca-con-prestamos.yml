solution: |
  import java.time.LocalDate;
  import java.time.temporal.ChronoUnit;
  import java.util.HashMap;
  import java.util.Map;
  import java.util.Scanner;
  import java.util.TreeSet;

  class Biblioteca {
      private static final int DIAS_PRESTAMO = 14;
      private static final int MAXIMO_LIBROS = 3;
      private static final int MULTA_CENTIMOS_POR_DIA = 50;

      private record Prestamo(String socio, LocalDate vence) {}

      private final Map<String, String> libros = new HashMap<>();
      private final Map<String, Integer> deudas = new HashMap<>();
      private final Map<String, Prestamo> prestamos = new HashMap<>();

      void libro(String codigo, String titulo) {
          libros.put(codigo, titulo);
      }

      void socio(String nombre) {
          deudas.put(nombre, 0);
      }

      LocalDate prestar(String codigo, String socio, LocalDate fecha) {
          existeLibro(codigo);
          existeSocio(socio);
          if (prestamos.containsKey(codigo)) {
              throw new IllegalStateException("libro no disponible");
          }
          if (deudas.get(socio) > 0) {
              throw new IllegalStateException("multas pendientes");
          }
          long prestados = prestamos.values().stream().filter(p -> p.socio().equals(socio)).count();
          if (prestados >= MAXIMO_LIBROS) {
              throw new IllegalStateException("límite de préstamos");
          }
          LocalDate vence = fecha.plusDays(DIAS_PRESTAMO);
          prestamos.put(codigo, new Prestamo(socio, vence));
          return vence;
      }

      String devolver(String codigo, LocalDate fecha) {
          existeLibro(codigo);
          Prestamo prestamo = prestamos.remove(codigo);
          if (prestamo == null) {
              throw new IllegalStateException("libro no prestado");
          }
          long retraso = ChronoUnit.DAYS.between(prestamo.vence(), fecha);
          if (retraso <= 0) {
              return "Devuelto " + codigo;
          }
          int multa = (int) retraso * MULTA_CENTIMOS_POR_DIA;
          deudas.merge(prestamo.socio(), multa, Integer::sum);
          return "Devuelto " + codigo + " con " + retraso + " días de retraso, multa " + euros(multa) + " €";
      }

      String pagar(String socio) {
          existeSocio(socio);
          int deuda = deudas.put(socio, 0);
          return socio + " paga " + euros(deuda) + " €";
      }

      String estado(String socio) {
          existeSocio(socio);
          TreeSet<String> titulos = new TreeSet<>();
          prestamos.forEach((codigo, p) -> {
              if (p.socio().equals(socio)) {
                  titulos.add(libros.get(codigo));
              }
          });
          StringBuilder texto = new StringBuilder(socio + ": " + titulos.size() + " libros, deuda "
                  + euros(deudas.get(socio)) + " €");
          for (String titulo : titulos) {
              texto.append("\n  ").append(titulo);
          }
          return texto.toString();
      }

      private void existeLibro(String codigo) {
          if (!libros.containsKey(codigo)) {
              throw new IllegalArgumentException("no existe " + codigo);
          }
      }

      private void existeSocio(String nombre) {
          if (!deudas.containsKey(nombre)) {
              throw new IllegalArgumentException("no existe " + nombre);
          }
      }

      private static String euros(int centimos) {
          return String.format("%d.%02d", centimos / 100, centimos % 100);
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          Biblioteca biblioteca = new Biblioteca();
          while (entrada.hasNextLine()) {
              String[] partes = entrada.nextLine().strip().split(" ", 2);
              String orden = partes[0];
              String resto = partes.length > 1 ? partes[1] : "";
              try {
                  switch (orden) {
                      case "libro" -> {
                          String[] datos = resto.split(" ", 2);
                          biblioteca.libro(datos[0], datos[1]);
                      }
                      case "socio" -> biblioteca.socio(resto);
                      case "prestar" -> {
                          String[] datos = resto.split(" ");
                          LocalDate vence = biblioteca.prestar(datos[0], datos[1], LocalDate.parse(datos[2]));
                          System.out.println("Prestado " + datos[0] + " a " + datos[1] + " hasta " + vence);
                      }
                      case "devolver" -> {
                          String[] datos = resto.split(" ");
                          System.out.println(biblioteca.devolver(datos[0], LocalDate.parse(datos[1])));
                      }
                      case "pagar" -> System.out.println(biblioteca.pagar(resto));
                      case "estado" -> System.out.println(biblioteca.estado(resto));
                      default -> { }
                  }
              } catch (IllegalArgumentException | IllegalStateException e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
  }
hints:
  - 'La idea: es un gestor como el de tareas, con libros, socios y préstamos. Ve orden a orden: primero `libro` y `socio`, después `prestar` y `devolver`, y al final `pagar` y `estado`. Prueba cada una antes de seguir.'
  - 'Qué usar: mapas para libros y socios, `fecha.plusDays(14)` para el vencimiento y `ChronoUnit.DAYS.between(vence, devolucion)` para los días de retraso. Guarda los importes en céntimos (enteros) y formatea los euros solo al escribir, para evitar errores de redondeo con `double`.'
  - 'El plan: una clase `Biblioteca` con un método por orden que compruebe las reglas en el orden del enunciado y lance excepciones con el mensaje exacto. El `main` lee cada línea, llama al método que toca y, si hay excepción, escribe `Error: ` + el mensaje.'
