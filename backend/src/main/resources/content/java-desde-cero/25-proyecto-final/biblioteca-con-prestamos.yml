title: Biblioteca con préstamos
summary: Reglas de negocio con fechas, límites por socio y multas por retraso.
difficulty: HARD
statement: |
  Gestiona los préstamos de una biblioteca. Cada préstamo dura **14 días**: si se devuelve más tarde, la multa es de **0,50 € por día** de retraso. Un socio no puede tener más de **3 libros** prestados a la vez ni pedir libros si tiene multas sin pagar.

  Órdenes, una por línea:

  | Orden | Efecto y salida |
  | --- | --- |
  | `libro <código> <título>` | Da de alta un libro (el título puede tener espacios). |
  | `socio <nombre>` | Da de alta un socio. |
  | `prestar <código> <socio> <fecha>` | Presta el libro. Escribe `Prestado <código> a <socio> hasta <fecha + 14 días>`. |
  | `devolver <código> <fecha>` | Escribe `Devuelto <código>` y, si hay retraso, ` con <días> días de retraso, multa <importe con 2 decimales> €`. La multa se suma a la deuda del socio. |
  | `pagar <socio>` | Pone su deuda a 0 y escribe `<socio> paga <importe> €`. |
  | `estado <socio>` | Escribe `<socio>: <n> libros, deuda <importe> €` y, debajo, los títulos que tiene, ordenados, con dos espacios de sangría. |

  Errores, con el formato `Error: <mensaje>`: `libro no disponible` (ya prestado), `límite de préstamos`, `multas pendientes`, `libro no prestado` (al devolver), `no existe <código o nombre>`.
