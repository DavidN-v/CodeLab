title: Ordena las tareas
summary: Coloca en orden las líneas que leen tareas, las ordenan por prioridad y las listan.
difficulty: EASY
kind: parsons
statement: |
  Un calentamiento antes del gestor completo. Cada línea de la entrada es una tarea con el formato `<título>;<prioridad>` (la prioridad es `alta`, `media` o `baja`).

  El programa debe leer todas las tareas, ordenarlas por prioridad (alta primero; a igual prioridad, en el orden en que llegaron) y escribir cada una como `[<PRIORIDAD>] <título>`. Al final escribe `Total: <número de tareas>`.

  El `enum` y el `record` ya están escritos. Ordena las líneas del `main`. Cuidado: hay líneas que sobran.
