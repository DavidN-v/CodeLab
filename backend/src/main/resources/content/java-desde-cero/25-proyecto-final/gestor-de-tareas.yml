title: Gestor de tareas
summary: Una aplicación completa de consola con modelo, reglas, consultas y errores.
difficulty: HARD
statement: |
  Construye un gestor de tareas que procese órdenes, una por línea, con los campos separados por `;`:

  | Orden | Efecto y salida |
  | --- | --- |
  | `añadir;<título>;<prioridad>;<límite>` | Añade una tarea pendiente con el siguiente id (empieza en 1). La prioridad es `alta`, `media` o `baja`; el límite (fecha `AAAA-MM-DD`) es opcional. Escribe `Añadida #<id>`. |
  | `completar;<id>` | Marca la tarea como completada. Escribe `Completada #<id>`. |
  | `pendientes` | Escribe las tareas pendientes ordenadas por prioridad (alta primero), después por fecha límite (las que no tienen van al final) y después por id. |
  | `vencidas;<fecha>` | Igual, pero solo las pendientes con límite **anterior** a esa fecha. |
  | `resumen` | Escribe `Pendientes: <n> (alta <a>, media <m>, baja <b>), completadas: <c>`. |

  Cada tarea se escribe como `#<id> [<PRIORIDAD>] <título>` y, si tiene límite, ` (vence <fecha>)` al final.

  Errores (el programa sigue con la siguiente orden):

  - Título vacío → `Error: título vacío`
  - Prioridad desconocida → `Error: prioridad no válida`
  - Completar un id inexistente → `Error: no existe la tarea #<id>`
  - Completar una tarea ya completada → `Error: la tarea #<id> ya está completada`
  - Cualquier otra orden → `Error: orden desconocida`
starter: |
