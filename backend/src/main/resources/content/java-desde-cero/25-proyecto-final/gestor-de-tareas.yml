  import java.util.Comparator;
  import java.util.LinkedHashMap;
  import java.util.Map;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          while (entrada.hasNextLine()) {
              String[] partes = entrada.nextLine().split(";", -1);
          }
      }
  }
solution: |
  import java.time.LocalDate;
  import java.util.Comparator;
  import java.util.LinkedHashMap;
  import java.util.List;
  import java.util.Map;
  import java.util.Scanner;

  enum Prioridad { ALTA, MEDIA, BAJA }

  record Tarea(int id, String titulo, Prioridad prioridad, LocalDate limite, boolean completada) {
      Tarea completar() {
          return new Tarea(id, titulo, prioridad, limite, true);
      }

      @Override
      public String toString() {
          return "#" + id + " [" + prioridad + "] " + titulo + (limite == null ? "" : " (vence " + limite + ")");
      }
  }

  class Gestor {
      private static final Comparator<Tarea> ORDEN = Comparator.comparing(Tarea::prioridad)
          .thenComparing(Tarea::limite, Comparator.nullsLast(Comparator.naturalOrder()))
          .thenComparing(Tarea::id);

      private final Map<Integer, Tarea> tareas = new LinkedHashMap<>();
      private int siguienteId = 1;

      int anadir(String titulo, String prioridad, String limite) {
          if (titulo.isBlank()) {
              throw new IllegalArgumentException("título vacío");
          }
          Prioridad p;
          try {
              p = Prioridad.valueOf(prioridad.strip().toUpperCase());
          } catch (IllegalArgumentException e) {
              throw new IllegalArgumentException("prioridad no válida");
          }
          LocalDate fecha = limite == null || limite.isBlank() ? null : LocalDate.parse(limite.strip());
          int id = siguienteId++;
          tareas.put(id, new Tarea(id, titulo.strip(), p, fecha, false));
          return id;
      }

      void completar(int id) {
          Tarea tarea = tareas.get(id);
          if (tarea == null) {
              throw new IllegalArgumentException("no existe la tarea #" + id);
          }
          if (tarea.completada()) {
              throw new IllegalStateException("la tarea #" + id + " ya está completada");
          }
          tareas.put(id, tarea.completar());
      }

      List<Tarea> pendientes() {
          return tareas.values().stream().filter(t -> !t.completada()).sorted(ORDEN).toList();
      }

      List<Tarea> vencidas(LocalDate fecha) {
          return pendientes().stream().filter(t -> t.limite() != null && t.limite().isBefore(fecha)).toList();
      }

      String resumen() {
          List<Tarea> pendientes = pendientes();
          long completadas = tareas.size() - pendientes.size();
          return "Pendientes: " + pendientes.size() + " (alta " + contar(pendientes, Prioridad.ALTA) + ", media "
                  + contar(pendientes, Prioridad.MEDIA) + ", baja " + contar(pendientes, Prioridad.BAJA)
                  + "), completadas: " + completadas;
      }

      private static long contar(List<Tarea> tareas, Prioridad prioridad) {
          return tareas.stream().filter(t -> t.prioridad() == prioridad).count();
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          Gestor gestor = new Gestor();
          while (entrada.hasNextLine()) {
              String[] partes = entrada.nextLine().split(";", -1);
              try {
                  switch (partes[0].strip()) {
                      case "añadir" -> System.out.println("Añadida #" + gestor.anadir(partes[1], partes[2],
                              partes.length > 3 ? partes[3] : null));
                      case "completar" -> {
                          int id = Integer.parseInt(partes[1].strip());
                          gestor.completar(id);
                          System.out.println("Completada #" + id);
                      }
                      case "pendientes" -> gestor.pendientes().forEach(System.out::println);
                      case "vencidas" -> gestor.vencidas(LocalDate.parse(partes[1].strip())).forEach(System.out::println);
                      case "resumen" -> System.out.println(gestor.resumen());
                      default -> System.out.println("Error: orden desconocida");
                  }
              } catch (IllegalArgumentException | IllegalStateException e) {
                  System.out.println("Error: " + e.getMessage());
              }
          }
      }
  }
hints:
  - 'La idea: es el gestor de la lección «Construir el gestor de tareas», con sus propios mensajes. Ve paso a paso: primero el modelo, después las reglas y al final la lectura de órdenes. Comprueba cada orden con el ejemplo antes de pasar a la siguiente.'
  - 'Qué usar: un `enum Prioridad { ALTA, MEDIA, BAJA }` (su orden natural ya es el de urgencia), un `record Tarea`, un `LinkedHashMap<Integer, Tarea>` y el comparador `Comparator.comparing(Tarea::prioridad).thenComparing(Tarea::limite, Comparator.nullsLast(Comparator.naturalOrder())).thenComparing(Tarea::id)`. Usa `split(";", -1)` para conservar un título vacío.'
  - 'El plan: crea una clase `Gestor` cuyos métodos lancen excepciones con el mensaje exacto (`título vacío`, `prioridad no válida`, `no existe la tarea #<id>`…). En `main`, lee cada línea, decide la orden con un `switch` sobre `partes[0]` y envuélvelo en un `try`/`catch` que escriba `Error: ` + el mensaje.'
