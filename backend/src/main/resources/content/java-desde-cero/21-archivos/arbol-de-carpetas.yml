solution: |
  import java.io.IOException;
  import java.nio.file.Files;
  import java.nio.file.Path;
  import java.util.List;
  import java.util.Scanner;
  import java.util.stream.Stream;

  public class Main {
      public static void main(String[] args) throws IOException {
          Scanner entrada = new Scanner(System.in);
          Path raiz = Path.of("proyecto");
          Files.createDirectories(raiz);
          while (entrada.hasNextLine()) {
              String ruta = entrada.nextLine().strip();
              if (ruta.isEmpty()) {
                  continue;
              }
              Path archivo = raiz.resolve(ruta);
              Files.createDirectories(archivo.getParent());
              Files.writeString(archivo, ruta);
          }
          List<Path> rutas;
          try (Stream<Path> recorrido = Files.walk(raiz)) {
              rutas = recorrido.sorted().toList();
          }
          int carpetas = 0;
          int archivos = 0;
          for (Path ruta : rutas) {
              int nivel = raiz.relativize(ruta).getNameCount();
              boolean esRaiz = ruta.equals(raiz);
              String sangria = esRaiz ? "" : "  ".repeat(nivel);
              if (Files.isDirectory(ruta)) {
                  carpetas++;
                  System.out.println(sangria + ruta.getFileName() + "/");
              } else {
                  archivos++;
                  System.out.println(sangria + ruta.getFileName());
              }
          }
          System.out.println(carpetas + " carpetas, " + archivos + " archivos");
      }
  }
hints:
  - 'La idea: primero construyes el árbol en el disco (carpetas y archivos dentro de `proyecto`) y después lo recorres para dibujarlo con sangría según la profundidad.'
  - 'Qué usar: `raiz.resolve(ruta)` y `getParent()` para saber qué carpeta crear con `Files.createDirectories`; `Files.walk(raiz)` en un try-with-resources con `sorted()`; `raiz.relativize(ruta).getNameCount()` da el nivel.'
  - 'El plan: por cada línea, crea las carpetas del padre y escribe el archivo; recoge `Files.walk(raiz).sorted().toList()`; para cada ruta, sangría `"  ".repeat(nivel)` (ninguna para la raíz), nombre con `getFileName()` y `/` si `Files.isDirectory`; cuenta carpetas y archivos y escribe el total.'
tests:
  - input: |
      src/App.java
      README.md
    output: |
      proyecto/
        README.md
        src/
          App.java
      2 carpetas, 2 archivos
    sample: true
  - input: |
      src/main/java/App.java
      src/main/resources/config.yml
      src/test/AppTest.java
      pom.xml
    output: |
      proyecto/
        pom.xml
        src/
          main/
            java/
              App.java
            resources/
              config.yml
          test/
            AppTest.java
      6 carpetas, 4 archivos
