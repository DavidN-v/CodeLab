title: Árbol de carpetas
summary: Crea una estructura de directorios y recórrela con Files.walk.
difficulty: HARD
statement: |
  Cada línea de la entrada es una ruta relativa de un **archivo** con `/` como separador, por ejemplo `src/main/App.java`. Para cada una:

  - crea las carpetas necesarias con `Files.createDirectories`,
  - crea el archivo con el texto de la propia ruta como contenido.

  Todo debe ir dentro de una carpeta raíz `proyecto`. Después recorre `proyecto` con `Files.walk` y escribe el árbol ordenado alfabéticamente por ruta, con dos espacios de sangría por nivel y una `/` tras el nombre de las carpetas (la raíz incluida, sin sangría). Termina con `<carpetas> carpetas, <archivos> archivos` (la raíz cuenta como carpeta).

  **Ejemplo:** con `src/App.java` y `README.md`:

  ```
  proyecto/
    README.md
    src/
      App.java
  2 carpetas, 2 archivos
  ```
