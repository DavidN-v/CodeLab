          List<String> lineas = new ArrayList<>();
          while (entrada.hasNextLine()) {
              lineas.add(entrada.nextLine());
          }
          Path diario = Path.of("diario.txt");

      }
  }
solution: |
  import java.io.IOException;
  import java.nio.file.Files;
  import java.nio.file.Path;
  import java.util.ArrayList;
  import java.util.List;
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) throws IOException {
          Scanner entrada = new Scanner(System.in);
          List<String> lineas = new ArrayList<>();
          while (entrada.hasNextLine()) {
              lineas.add(entrada.nextLine());
          }
          Path diario = Path.of("diario.txt");
          Files.write(diario, lineas);
          List<String> leidas = Files.readAllLines(diario);
          for (int i = 0; i < leidas.size(); i++) {
              System.out.println((i + 1) + ". " + leidas.get(i));
          }
          System.out.println("Archivo: " + Files.size(diario) + " bytes");
      }
  }
hints:
  - 'La idea: guarda las líneas en un archivo y después haz como si no las tuvieras: léelas de nuevo desde el disco y numéralas.'
  - 'Qué usar: `Files.write(diario, lineas)` para escribir (cada elemento en una línea), `Files.readAllLines(diario)` para leer y `Files.size(diario)` para el tamaño en bytes (las letras con tilde ocupan 2).'
  - 'El plan: escribe la lista; guarda en `leidas` lo que devuelve `readAllLines`; recórrela con `for (int i = 0; i < leidas.size(); i++)` imprimiendo `(i + 1) + ". " + leidas.get(i)`; termina con `"Archivo: " + Files.size(diario) + " bytes"`.'
tests:
  - input: |
      Hoy aprendí Java
      Mañana, streams
    output: |
      1. Hoy aprendí Java
      2. Mañana, streams
      Archivo: 35 bytes
    sample: true
  - input: |
      a
    output: |
      1. a
      Archivo: 2 bytes
