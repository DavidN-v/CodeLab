title: Resumen de un CSV
summary: Lee un archivo línea a línea con BufferedReader y try-with-resources.
difficulty: MEDIUM
statement: |
  La entrada es un archivo CSV con una cabecera (`producto,categoria,precio`) y una fila por producto. El programa debe:

  1. Copiar la entrada tal cual a `productos.csv`.
  2. Leer `productos.csv` con un `BufferedReader` dentro de un **try-with-resources**, saltándose la cabecera y las líneas vacías.
  3. Escribir, por categoría en orden alfabético: `<categoria>: <número de productos> productos, media <precio medio con 2 decimales>`.
  4. Si una fila tiene un precio que no es un número, ignorarla y contarla; al final escribe `Filas inválidas: <n>`.
