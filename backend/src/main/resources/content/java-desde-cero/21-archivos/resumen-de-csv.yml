solution: |
  import java.io.BufferedReader;
  import java.io.IOException;
  import java.nio.file.Files;
  import java.nio.file.Path;
  import java.util.Map;
  import java.util.Scanner;
  import java.util.TreeMap;

  public class Main {
      public static void main(String[] args) throws IOException {
          Scanner entrada = new Scanner(System.in);
          StringBuilder csv = new StringBuilder();
          while (entrada.hasNextLine()) {
              csv.append(entrada.nextLine()).append('\n');
          }
          Path archivo = Path.of("productos.csv");
          Files.writeString(archivo, csv);

          Map<String, double[]> porCategoria = new TreeMap<>();
          int invalidas = 0;
          try (BufferedReader lector = Files.newBufferedReader(archivo)) {
              lector.readLine();
              String linea;
              while ((linea = lector.readLine()) != null) {
                  if (linea.isBlank()) {
                      continue;
                  }
                  String[] partes = linea.split(",");
                  try {
                      double precio = Double.parseDouble(partes[2].trim());
                      double[] acumulado = porCategoria.computeIfAbsent(partes[1].trim(), c -> new double[2]);
                      acumulado[0]++;
                      acumulado[1] += precio;
                  } catch (NumberFormatException | ArrayIndexOutOfBoundsException e) {
                      invalidas++;
                  }
              }
          }
          porCategoria.forEach((categoria, datos) -> System.out.printf("%s: %d productos, media %.2f%n",
                  categoria, (int) datos[0], datos[1] / datos[0]));
          System.out.println("Filas inválidas: " + invalidas);
      }
  }
hints:
  - 'La idea: lee el archivo fila a fila, salta la cabecera y las líneas vacías, y ve acumulando por categoría cuántos productos hay y cuánto suman sus precios.'
  - 'Qué usar: `Files.newBufferedReader(archivo)` dentro de `try (...)`, un `readLine()` suelto antes del bucle para descartar la cabecera, un `TreeMap<String, double[]>` con `{cantidad, suma}` y un `try`/`catch (NumberFormatException e)` para las filas malas.'
  - 'El plan: en el bucle `while ((linea = lector.readLine()) != null)`, salta las vacías con `isBlank()`, haz `split(",")`, intenta `Double.parseDouble(partes[2].trim())`; si va bien suma en `computeIfAbsent(categoria, c -> new double[2])`, si falla incrementa `invalidas`; al final imprime cada categoría con `printf("%s: %d productos, media %.2f%n", ...)`.'
tests:
  - input: |
      producto,categoria,precio
      Taza,hogar,6.5
      Libro,cultura,18
      Lámpara,hogar,25
      Disco,cultura,abc

      Cuaderno,cultura,3.25
    output: |
      cultura: 2 productos, media 10.63
      hogar: 2 productos, media 15.75
      Filas inválidas: 1
    sample: true
  - input: |
      producto,categoria,precio
      Uno,a,1
    output: |
      a: 1 productos, media 1.00
      Filas inválidas: 0
