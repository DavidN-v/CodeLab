title: Cuenta bancaria
summary: Encapsula el saldo y valida cada operación.
difficulty: MEDIUM
statement: |
  Completa la clase `Cuenta` para que el saldo sea privado y solo cambie a través de:

  - `boolean ingresar(int cantidad)`: suma la cantidad si es positiva; devuelve si se hizo.
  - `boolean retirar(int cantidad)`: resta si es positiva y hay saldo suficiente; devuelve si se hizo.
  - `int getSaldo()`.

  La entrada es una serie de operaciones, una por línea: `ingresar <n>` o `retirar <n>`. El `main` imprime `ok` o `rechazada` según lo que devuelvan tus métodos y, al final, `Saldo: <saldo>`.
