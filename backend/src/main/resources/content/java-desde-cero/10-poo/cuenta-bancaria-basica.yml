solution: |
  import java.util.Scanner;

  class Cuenta {
      private int saldo = 0;

      boolean ingresar(int cantidad) {
          if (cantidad <= 0) {
              return false;
          }
          saldo += cantidad;
          return true;
      }

      boolean retirar(int cantidad) {
          if (cantidad <= 0 || cantidad > saldo) {
              return false;
          }
          saldo -= cantidad;
          return true;
      }

      int getSaldo() {
          return saldo;
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          Cuenta cuenta = new Cuenta();
          while (entrada.hasNext()) {
              String operacion = entrada.next();
              int cantidad = entrada.nextInt();
              boolean hecha = operacion.equals("ingresar") ? cuenta.ingresar(cantidad) : cuenta.retirar(cantidad);
              System.out.println(hecha ? "ok" : "rechazada");
          }
          System.out.println("Saldo: " + cuenta.getSaldo());
      }
  }
hints:
  - Cada método comprueba primero las condiciones que lo harían inválido y devuelve `false`.
  - Recuerda quitar los comentarios del `main` cuando tus métodos existan.
