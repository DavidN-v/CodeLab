title: Cajero con excepciones propias
summary: Define una excepción de dominio que lleva información útil.
difficulty: HARD
statement: |
  Crea una excepción `SaldoInsuficienteException` (unchecked) que guarde cuánto falta, y una clase `Cajero` con un saldo inicial y un método `void retirar(int cantidad)` que:

  - Lance `IllegalArgumentException("Cantidad no válida")` si la cantidad no es positiva o no es múltiplo de 10.
  - Lance `SaldoInsuficienteException` si no hay saldo suficiente.
  - Si todo va bien, descuente la cantidad.

  La entrada empieza con el saldo inicial y sigue con cantidades a retirar. Para cada una escribe `Retirados <n>`, `Rechazada: Cantidad no válida` o `Rechazada: faltan <x>`. Al final, `Saldo: <saldo>`.
starter: |
  import java.util.Scanner;

  // Crea SaldoInsuficienteException y Cajero

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int saldoInicial = entrada.nextInt();

      }
  }
solution: |
  import java.util.Scanner;

  class SaldoInsuficienteException extends RuntimeException {
      private final int faltan;

      SaldoInsuficienteException(int faltan) {
          super("Faltan " + faltan);
          this.faltan = faltan;
      }

      int getFaltan() {
          return faltan;
      }
  }

  class Cajero {
      private int saldo;

      Cajero(int saldo) {
          this.saldo = saldo;
      }

      void retirar(int cantidad) {
          if (cantidad <= 0 || cantidad % 10 != 0) {
              throw new IllegalArgumentException("Cantidad no válida");
          }
          if (cantidad > saldo) {
              throw new SaldoInsuficienteException(cantidad - saldo);
          }
          saldo -= cantidad;
      }

      int getSaldo() {
          return saldo;
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          Cajero cajero = new Cajero(entrada.nextInt());
          while (entrada.hasNextInt()) {
              int cantidad = entrada.nextInt();
              try {
                  cajero.retirar(cantidad);
                  System.out.println("Retirados " + cantidad);
              } catch (SaldoInsuficienteException e) {
                  System.out.println("Rechazada: faltan " + e.getFaltan());
              } catch (IllegalArgumentException e) {
                  System.out.println("Rechazada: " + e.getMessage());
              }
          }
          System.out.println("Saldo: " + cajero.getSaldo());
      }
  }
hints:
  - "`class SaldoInsuficienteException extends RuntimeException` con un campo `faltan` y un getter."
  - Valida primero la cantidad y después el saldo, para que una cantidad inválida no se confunda con falta de saldo.
tests:
  - input: "100 30 25 90 70\n"
    output: |
      Retirados 30
      Rechazada: Cantidad no válida
      Rechazada: faltan 20
      Retirados 70
      Saldo: 0
    sample: true
  - input: "50 0 -10 50 10\n"
    output: |
      Rechazada: Cantidad no válida
      Rechazada: Cantidad no válida
      Retirados 50
      Rechazada: faltan 10
      Saldo: 0
