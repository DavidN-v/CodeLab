title: Contar vocales
summary: Recorre una frase carácter a carácter.
difficulty: EASY
statement: |
  Lee una línea de texto y escribe cuántas vocales tiene. Cuentan las vocales `a e i o u` en mayúscula o minúscula, y también las acentuadas `á é í ó ú` (y sus mayúsculas).

  **Ejemplo:** `Murciélago` → `5`.
starter: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String frase = entrada.nextLine();

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String frase = entrada.nextLine();
          String vocales = "aeiouáéíóú";
          int cuenta = 0;
          for (char c : frase.toLowerCase().toCharArray()) {
              if (vocales.indexOf(c) >= 0) {
                  cuenta++;
              }
          }
          System.out.println(cuenta);
      }
  }
hints:
  - 'La idea: miras la frase letra a letra y, cada vez que la letra es una vocal, sumas uno a un contador.'
  - 'Qué usar: `toLowerCase()` para no distinguir mayúsculas, un for-each sobre `toCharArray()` y un String con todas las vocales: `vocales.indexOf(c) >= 0` dice si `c` es una de ellas.'
  - 'El plan: `String vocales = "aeiouáéíóú";` → `cuenta = 0` → para cada `c` de `frase.toLowerCase().toCharArray()`, si `vocales.indexOf(c) >= 0`, `cuenta++` → imprime `cuenta`.'
tests:
  - input: "Murciélago\n"
    output: "5\n"
    sample: true
  - input: "Hola Mundo\n"
    output: "4\n"
  - input: "rhythm\n"
    output: "0\n"
  - input: "AEIOU aeiou ÁÉÍÓÚ\n"
    output: "15\n"
