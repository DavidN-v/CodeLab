title: ¿Es un palíndromo?
summary: Compara un texto con su inverso ignorando espacios y mayúsculas.
difficulty: MEDIUM
statement: |
  Un palíndromo se lee igual de izquierda a derecha que de derecha a izquierda. Lee una línea y escribe `sí` si es un palíndromo o `no` si no lo es.

  Ignora los espacios y la diferencia entre mayúsculas y minúsculas (no hace falta tratar acentos ni signos).

  **Ejemplos:** `Anita lava la tina` → `sí`; `Java` → `no`.
starter: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String texto = entrada.nextLine();

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String texto = entrada.nextLine();
          String limpio = texto.replace(" ", "").toLowerCase();
          String invertido = new StringBuilder(limpio).reverse().toString();
          System.out.println(limpio.equals(invertido) ? "sí" : "no");
      }
  }
hints:
  - Primero normaliza el texto quitando espacios y pasándolo a minúsculas.
  - "`new StringBuilder(texto).reverse().toString()` invierte un String."
tests:
  - input: "Anita lava la tina\n"
    output: "sí\n"
    sample: true
  - input: "Java\n"
    output: "no\n"
    sample: true
  - input: "radar\n"
    output: "sí\n"
  - input: "a\n"
    output: "sí\n"
  - input: "Se van sus naves\n"
    output: "sí\n"
  - input: "ab\n"
    output: "no\n"
