solution: |
  import java.util.Scanner;

  public class Main {
      static String ocultar(String secreta, String probadas) {
          StringBuilder oculta = new StringBuilder();
          for (int i = 0; i < secreta.length(); i++) {
              char c = secreta.charAt(i);
              if (i > 0) {
                  oculta.append(' ');
              }
              if (probadas.indexOf(c) >= 0) {
                  oculta.append(c);
              } else {
                  oculta.append('_');
              }
          }
          return oculta.toString();
      }

      static boolean completa(String oculta) {
          return oculta.indexOf('_') < 0;
      }

      static void mostrar(String secreta, String probadas, int vidas) {
          System.out.println("Palabra: " + ocultar(secreta, probadas));
          System.out.println("Vidas: " + vidas);
      }

      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String secreta = entrada.nextLine().strip();
          int vidas = 6;
          StringBuilder probadas = new StringBuilder();
          mostrar(secreta, probadas.toString(), vidas);
          while (entrada.hasNextLine()) {
              String linea = entrada.nextLine().strip();
              if (linea.isEmpty()) {
                  continue;
              }
              char letra = Character.toLowerCase(linea.charAt(0));
              if (probadas.indexOf(String.valueOf(letra)) >= 0) {
                  System.out.println("Ya habías probado la " + letra + ".");
              } else {
                  probadas.append(letra);
                  if (secreta.indexOf(letra) >= 0) {
                      System.out.println("¡Bien! La " + letra + " está en la palabra.");
                  } else {
                      vidas--;
                      System.out.println("La " + letra + " no está. Pierdes una vida.");
                  }
              }
              mostrar(secreta, probadas.toString(), vidas);
              if (completa(ocultar(secreta, probadas.toString()))) {
                  System.out.println("¡Ganaste! La palabra era " + secreta + ".");
                  break;
              }
              if (vidas == 0) {
                  System.out.println("¡Ahorcado! La palabra era " + secreta + ".");
                  break;
              }
          }
      }
  }
hints:
  - 'La idea: el estado de la partida son tres cosas: la palabra secreta (no cambia), las letras probadas (crece) y las vidas (baja). Todo lo que escribes se calcula a partir de esas tres.'
  - 'Qué usar: un `StringBuilder` para las letras probadas, `indexOf(...) >= 0` para saber si una letra está en un texto, un método `ocultar` que construye la palabra con `_` y un bucle `while (entrada.hasNextLine())` que termina con `break`.'
  - 'El plan: mostrar estado → bucle: leer letra → si `probadas` la contiene, «Ya habías probado»; si no, añadirla y, según `secreta.indexOf(letra) >= 0`, «¡Bien!» o restar vida → mostrar estado → si `ocultar(...)` no tiene `_`, ganaste y `break`; si `vidas == 0`, ahorcado y `break`.'
