title: Invertir el orden de las palabras
summary: Usa split y StringBuilder para reordenar palabras.
difficulty: MEDIUM
statement: |
  Lee una línea con palabras separadas por uno o más espacios (puede haber espacios al principio y al final). Escribe las palabras en orden inverso, separadas por **un solo** espacio.

  **Ejemplo:** `  hola   mundo de Java ` → `Java de mundo hola`.
starter: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String linea = entrada.nextLine();

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String linea = entrada.nextLine();
          String[] palabras = linea.strip().split("\\s+");
          StringBuilder resultado = new StringBuilder();
          for (int i = palabras.length - 1; i >= 0; i--) {
              resultado.append(palabras[i]);
              if (i > 0) {
                  resultado.append(' ');
              }
          }
          System.out.println(resultado);
      }
  }
hints:
  - 'La idea: parte la frase en palabras, como cortar una barra de pan, y después recoge los trozos empezando por el último.'
  - 'Qué usar: `strip()` para quitar los espacios de los extremos, `split("\s+")` para que varios espacios seguidos cuenten como un solo separador, y un `StringBuilder`.'
  - 'El plan: `palabras = linea.strip().split("\s+");` → recorre de `palabras.length - 1` a 0 → añade cada palabra y un espacio solo si `i > 0` → imprime.'
tests:
  - input: "  hola   mundo de Java \n"
    output: "Java de mundo hola\n"
    sample: true
  - input: "uno\n"
    output: "uno\n"
  - input: "a b c d e\n"
    output: "e d c b a\n"
