title: Tabla de multiplicar
summary: Imprime la tabla de un número con un bucle for.
difficulty: EASY
statement: |
  Lee un número entero `n` y escribe su tabla de multiplicar del 1 al 10, con este formato exacto:

  ```
  n x 1 = ...
  n x 2 = ...
  ...
  n x 10 = ...
  ```

  **Ejemplo** con `7`: la primera línea es `7 x 1 = 7` y la última `7 x 10 = 70`.
starter: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          int n = entrada.nextInt();
          for (int i = 1; i <= 10; i++) {
              System.out.println(n + " x " + i + " = " + n * i);
          }
      }
  }
hints:
  - Un `for` de 1 a 10, ambos incluidos, da exactamente 10 vueltas.
  - En cada vuelta imprime una línea usando el número y el contador.
