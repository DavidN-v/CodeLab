title: ¿Qué imprime? Divisiones y conversiones
summary: Adivina la salida de divisiones enteras, decimales y castings.
difficulty: EASY
kind: predict
statement: |
  Lee este programa **sin ejecutarlo** y escribe exactamente lo que imprime.

  Antes de cada línea, pregúntate: ¿los dos lados de la división son enteros? ¿El casting corta o redondea? ¿Qué se calcula primero, lo de dentro del paréntesis o la conversión?

  Ten en cuenta que un `double` siempre se imprime con al menos un decimal (`4.0`, no `4`).
starter: |
  public class Main {
      public static void main(String[] args) {
          int a = 9;
          int b = 2;
          System.out.println(a / b);
          System.out.println(a / 2.0);
          System.out.println((int) 7.9);
          System.out.println((double) (a / b));
          char letra = 'A';
          System.out.println((char) (letra + 1));
      }
  }
hints:
  - 'La idea: decide para cada línea qué tipo tiene el resultado (entero, decimal o carácter) y calcula su valor.'
  - 'Qué usar: entero / entero da entero (se descartan los decimales). Si uno de los dos es decimal, el resultado es decimal. `(int)` corta los decimales. Un `char` es un número por dentro.'
  - 'El plan: 9 / 2 da 4; 9 / 2.0 da 4.5; `(int) 7.9` da 7; `(double) (9 / 2)` primero hace la división entera y luego convierte; `''A'' + 1` es la letra siguiente.'
tests:
  - output: |
      4
      4.5
      7
      4.0
      B
