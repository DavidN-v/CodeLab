title: ¿Qué imprime? print y println
summary: Lee un programa sin ejecutarlo y adivina su salida exacta.
difficulty: EASY
kind: predict
statement: |
  Lee este programa con calma, **sin ejecutarlo**, y escribe exactamente lo que imprime en la consola.

  Fíjate en dos cosas:

  - ¿Qué instrucciones saltan de línea (`println`) y cuáles no (`print`)?
  - ¿Qué pasa cuando unes un texto con números usando `+`?

  No pasa nada si fallas: al comprobar la respuesta verás la salida real y podrás entender la diferencia.
starter: |
  public class Main {
      public static void main(String[] args) {
          System.out.print("Hola");
          System.out.println(", Java");
          System.out.println("1 + 1 = " + 1 + 1);
          System.out.print("Fin");
          System.out.println("!");
      }
  }
hints:
  - 'La idea: recorre el programa de arriba abajo, una instrucción cada vez, y apunta lo que va saliendo en la consola.'
  - 'Qué usar: `print` deja lo siguiente en la misma línea; `println` salta de línea después de escribir. Un texto + un número da un texto.'
  - 'El plan: las dos primeras instrucciones forman una sola línea. En la tercera, `"1 + 1 = " + 1` ya es un texto, así que el último `1` se pega detrás. Las dos últimas forman otra línea.'
tests:
  - output: |
      Hola, Java
      1 + 1 = 11
      Fin!
