title: Eco invertido
summary: Lee dos líneas y escríbelas en orden inverso.
difficulty: EASY
statement: |
  La entrada tiene exactamente dos líneas de texto. Escríbelas en el orden contrario: primero la segunda y después la primera.

  **Ejemplo**

  Entrada:

  ```
  primera
  segunda
  ```

  Salida:

  ```
  segunda
  primera
  ```
starter: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);

      }
  }
solution: |
  import java.util.Scanner;

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          String primera = entrada.nextLine();
          String segunda = entrada.nextLine();
          System.out.println(segunda);
          System.out.println(primera);
      }
  }
hints:
  - No puedes escribir la segunda línea antes de haberla leído. Lee las dos primero.
  - Guarda cada línea en su propia variable `String`.
tests:
  - input: |
      primera
      segunda
    output: |
      segunda
      primera
    sample: true
  - input: |
      Hola mundo
      Adiós mundo
    output: |
      Adiós mundo
      Hola mundo
  - input: |
      123
      abc
    output: |
      abc
      123
