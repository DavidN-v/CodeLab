lessons:
  - slug: que-es-java
    title: ¿Qué es Java?
    summary: El lenguaje, la máquina virtual y por qué el mismo programa corre en cualquier sistema.
    minutes: 8
  - slug: primer-programa
    title: Tu primer programa
    summary: La anatomía de un programa en Java, línea a línea, y cómo se compila y ejecuta.
    minutes: 10
  - slug: salida-por-consola
    title: Escribir en la consola
    summary: print, println y printf, secuencias de escape y comentarios.
    minutes: 10
  - slug: leer-datos
    title: Leer datos del usuario
    summary: Usar Scanner para leer texto y números de la entrada estándar.
    minutes: 12
  - slug: errores-comunes
    title: Leer los errores
    summary: Errores de compilación y de ejecución, y cómo interpretar sus mensajes.
    minutes: 10
exercises:
  - hola-mundo
  - tarjeta-de-presentacion
  - saludo-personalizado
  - eco-invertido
