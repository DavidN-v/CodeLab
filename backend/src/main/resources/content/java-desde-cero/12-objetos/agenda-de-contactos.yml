title: Agenda de contactos
summary: 'Miniproyecto: dos clases que colaboran para guardar, buscar y borrar contactos.'
difficulty: HARD
kind: project
statement: |
  Vas a construir una agenda de contactos que funciona con órdenes escritas, como un pequeño programa de terminal. Es tu primer programa con **dos clases que colaboran**.

  Recuerda la idea del módulo: **una clase es un molde de galletas; los objetos son las galletas**. `Contacto` es el molde y cada persona que guardes es una galleta. `Agenda` es la caja de galletas: hay una sola, y dentro guarda las referencias a todos los contactos.

  ## Paso 1: la clase `Contacto`

  Un contacto tiene tres datos de texto: `nombre`, `telefono` y `email`.

  - Hazlos `private final` (un contacto no cambia una vez creado).
  - Escribe un constructor que reciba los tres y los guarde con `this`.
  - Añade `String getNombre()`.
  - Sobrescribe `toString()` para que devuelva `nombre | telefono | email`, por ejemplo `Ana | 600111222 | ana@correo.es`.

  ## Paso 2: la clase `Agenda`

  La agenda guarda los contactos en un array de 100 posiciones y lleva la cuenta de cuántos hay:

  ```java fragment
  private final Contacto[] contactos = new Contacto[100];
  private int cantidad = 0;
  ```

  Escribe estos métodos:

  1. `Contacto buscar(String nombre)`: recorre las posiciones `0` a `cantidad - 1` y devuelve el contacto con ese nombre (compara con `equals`, ¡no con `==`!). Si no hay ninguno, devuelve `null`.
  2. `boolean agregar(Contacto c)`: si ya hay un contacto con ese nombre, devuelve `false` y no hace nada. Si no, lo guarda en la posición `cantidad`, suma 1 y devuelve `true`.
  3. `boolean eliminar(String nombre)`: busca la posición del contacto. Si no está, devuelve `false`. Si está, mueve una posición a la izquierda todos los que van detrás (para no dejar huecos), pon `null` en la última posición ocupada, resta 1 a `cantidad` y devuelve `true`.
  4. `void listar()`: imprime los contactos en el orden en que se agregaron (ver el paso 4).

  ## Paso 3: leer las órdenes

  En `main`, lee la entrada **línea a línea**. Cada línea es una orden; las palabras van separadas por espacios. El código inicial ya la parte en palabras con `split(" ")` y salta las líneas vacías: `partes[0]` es la orden y `partes[1]`, `partes[2]`... son los datos.

  | Orden | Qué hace |
  | --- | --- |
  | `AGREGAR nombre telefono email` | Crea un contacto y lo añade |
  | `BUSCAR nombre` | Muestra el contacto |
  | `ELIMINAR nombre` | Lo borra de la agenda |
  | `LISTAR` | Muestra todos los contactos |
  | `SALIR` | Termina el programa |

  Los nombres son una sola palabra y se distinguen mayúsculas de minúsculas (`Ana` y `ana` son distintos). Las órdenes siempre traen los datos que necesitan.

  ## Paso 4: las respuestas exactas

  | Situación | Imprime |
  | --- | --- |
  | `AGREGAR` con éxito | `Agregado: <nombre>` |
  | `AGREGAR` con un nombre que ya existe | `Error: <nombre> ya existe` |
  | `BUSCAR` con éxito | El `toString` del contacto (paso 1), como en el ejemplo |
  | `BUSCAR` o `ELIMINAR` de un nombre que no está | `No encontrado: <nombre>` |
  | `ELIMINAR` con éxito | `Eliminado: <nombre>` |
  | `LISTAR` con la agenda vacía | `Agenda vacía` |
  | `LISTAR` con contactos | Una línea `<n>. <contacto>` por cada uno (empezando en 1) y después `Total: <cantidad>` |
  | `SALIR` | `¡Hasta pronto!`, y no se procesa ninguna línea más |
  | Cualquier otra orden | `Orden desconocida: <orden>` |

  Si la entrada se acaba sin `SALIR`, el programa termina sin imprimir nada más.

  ## Ejemplo

  Entrada:

  ```
  AGREGAR Ana 600111222 ana@correo.es
  AGREGAR Luis 699888777 luis@correo.es
  BUSCAR Ana
  ELIMINAR Ana
  LISTAR
  SALIR
  ```

  Salida:

  ```
  Agregado: Ana
  Agregado: Luis
  Ana | 600111222 | ana@correo.es
  Eliminado: Ana
  1. Luis | 699888777 | luis@correo.es
  Total: 1
  ¡Hasta pronto!
  ```

  **Consejo:** ve paso a paso. Primero haz que funcionen `AGREGAR` y `LISTAR`, ejecuta, y después añade `BUSCAR`, `ELIMINAR` y `SALIR`.
