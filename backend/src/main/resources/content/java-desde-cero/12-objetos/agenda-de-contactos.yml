solution: |
  import java.util.Scanner;

  class Contacto {
      private final String nombre;
      private final String telefono;
      private final String email;

      Contacto(String nombre, String telefono, String email) {
          this.nombre = nombre;
          this.telefono = telefono;
          this.email = email;
      }

      String getNombre() {
          return nombre;
      }

      @Override
      public String toString() {
          return nombre + " | " + telefono + " | " + email;
      }
  }

  class Agenda {
      private final Contacto[] contactos = new Contacto[100];
      private int cantidad = 0;

      Contacto buscar(String nombre) {
          for (int i = 0; i < cantidad; i++) {
              if (contactos[i].getNombre().equals(nombre)) {
                  return contactos[i];
              }
          }
          return null;
      }

      boolean agregar(Contacto c) {
          if (buscar(c.getNombre()) != null) {
              return false;
          }
          contactos[cantidad] = c;
          cantidad++;
          return true;
      }

      boolean eliminar(String nombre) {
          int posicion = -1;
          for (int i = 0; i < cantidad; i++) {
              if (contactos[i].getNombre().equals(nombre)) {
                  posicion = i;
              }
          }
          if (posicion == -1) {
              return false;
          }
          for (int i = posicion; i < cantidad - 1; i++) {
              contactos[i] = contactos[i + 1];
          }
          contactos[cantidad - 1] = null;
          cantidad--;
          return true;
      }

      void listar() {
          if (cantidad == 0) {
              System.out.println("Agenda vacía");
              return;
          }
          for (int i = 0; i < cantidad; i++) {
              System.out.println((i + 1) + ". " + contactos[i]);
          }
          System.out.println("Total: " + cantidad);
      }
  }

  public class Main {
      public static void main(String[] args) {
          Scanner entrada = new Scanner(System.in);
          Agenda agenda = new Agenda();
          while (entrada.hasNextLine()) {
              String linea = entrada.nextLine().trim();
              if (linea.isEmpty()) {
                  continue;
              }
              String[] partes = linea.split(" ");
              String orden = partes[0];
              if (orden.equals("SALIR")) {
                  System.out.println("¡Hasta pronto!");
                  break;
              }
              switch (orden) {
                  case "AGREGAR" -> {
                      Contacto nuevo = new Contacto(partes[1], partes[2], partes[3]);
                      if (agenda.agregar(nuevo)) {
                          System.out.println("Agregado: " + partes[1]);
                      } else {
                          System.out.println("Error: " + partes[1] + " ya existe");
                      }
                  }
                  case "BUSCAR" -> {
                      Contacto encontrado = agenda.buscar(partes[1]);
                      if (encontrado == null) {
                          System.out.println("No encontrado: " + partes[1]);
                      } else {
                          System.out.println(encontrado);
                      }
                  }
                  case "ELIMINAR" -> {
                      if (agenda.eliminar(partes[1])) {
                          System.out.println("Eliminado: " + partes[1]);
                      } else {
                          System.out.println("No encontrado: " + partes[1]);
                      }
                  }
                  case "LISTAR" -> agenda.listar();
                  default -> System.out.println("Orden desconocida: " + orden);
              }
          }
      }
  }
hints:
  - 'La idea: `Contacto` solo sabe guardar sus datos y presentarse; `Agenda` sabe guardar contactos, buscarlos y borrarlos; `main` solo traduce cada orden en una llamada a la agenda.'
  - 'Qué usar: un array `Contacto[]` con un contador `cantidad`, `equals` para comparar nombres, `null` para «no lo he encontrado», `toString()` para imprimir un contacto y un `switch` sobre la orden con `break` del bucle al leer `SALIR`.'
  - 'El plan: `buscar` recorre de 0 a `cantidad - 1` y devuelve el contacto o `null`. `agregar` usa `buscar` para rechazar repetidos. `eliminar` encuentra la posición, hace `contactos[i] = contactos[i + 1]` desde ahí hasta el final y resta 1 a `cantidad`. En `main`, `new Contacto(partes[1], partes[2], partes[3])` para `AGREGAR`.'
