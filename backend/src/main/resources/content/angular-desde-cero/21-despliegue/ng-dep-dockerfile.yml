title: Un Dockerfile en dos etapas
summary: Ordena las líneas de un Dockerfile que compila con Node y sirve con nginx.
difficulty: MEDIUM
kind: parsons
statement: |
  Quieres una imagen de Docker pequeña para la app `mi-app`:

  - **Etapa 1** (`build`), con Node.js 22: instala las dependencias **exactas** del `package-lock.json` (copiando primero solo los archivos de paquetes, para aprovechar la caché de Docker), copia el resto del proyecto y compila con `npm run build`.
  - **Etapa 2**, con nginx: copia la configuración `nginx.conf` y, desde la etapa 1, **solo** la carpeta `dist/mi-app/browser`. Expone el puerto 80.

  Ordena las líneas. Cuidado: hay líneas que sobran.
starter: |
  # Dockerfile
  {{lines}}
solution: |
  # Dockerfile
  FROM node:22-alpine AS build
  WORKDIR /app
  COPY package.json package-lock.json ./
  RUN npm ci
  COPY . .
  RUN npm run build
  FROM nginx:alpine
  COPY nginx.conf /etc/nginx/conf.d/default.conf
  COPY --from=build /app/dist/mi-app/browser /usr/share/nginx/html
  EXPOSE 80
lines:
  - FROM node:22-alpine AS build
  - WORKDIR /app
  - COPY package.json package-lock.json ./
  - RUN npm ci
  - COPY . .
  - RUN npm run build
  - FROM nginx:alpine
  - COPY nginx.conf /etc/nginx/conf.d/default.conf
  - COPY --from=build /app/dist/mi-app/browser /usr/share/nginx/html
  - EXPOSE 80
distractors:
  - COPY --from=build /app /usr/share/nginx/html
  - RUN npm install
hints:
  - 'La idea: dos bloques que empiezan cada uno con un `FROM`. En el primero se prepara y compila; en el segundo solo se sirve lo compilado.'
  - 'Qué usar: `npm ci` (versiones exactas del lock) después de copiar los archivos de paquetes y antes de copiar el resto. En la segunda etapa, `COPY --from=build` con la carpeta `browser`, no con todo `/app`.'
  - 'El plan: FROM node AS build → WORKDIR → COPY paquetes → RUN npm ci → COPY . . → RUN npm run build → FROM nginx → COPY nginx.conf → COPY --from=build …/browser → EXPOSE 80.'
tests:
  - output: |
      docker build -t mi-tienda .
      docker run -p 8080:80 mi-tienda
      → la app responde en http://localhost:8080
    sample: true
