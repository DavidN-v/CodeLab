title: Una prueba con doble
summary: Ordena una prueba que sustituye un servicio por un doble con useValue.
difficulty: HARD
kind: parsons
statement: |
  El componente `Saludo` muestra `Hola, {{ sesion.nombre() }}` usando el servicio `Sesion`. Queremos probarlo **sin** la sesión real, con un doble cuyo nombre sea `Ada`.

  Ordena las líneas de la prueba. Cuidado: alguna línea sobra.
