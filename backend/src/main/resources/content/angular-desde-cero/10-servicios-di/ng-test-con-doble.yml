  describe('Saludo', () => {
    it('usa el nombre de la sesión', async () => {
  {{lines}}
    });
  });
solution: |
  // src/app/saludo.spec.ts
  import { signal } from '@angular/core';
  import { TestBed } from '@angular/core/testing';
  import { Sesion } from './sesion';
  import { Saludo } from './saludo';

  describe('Saludo', () => {
    it('usa el nombre de la sesión', async () => {
      const sesionFalsa = { nombre: signal('Ada') };
      TestBed.configureTestingModule({
        providers: [{ provide: Sesion, useValue: sesionFalsa }],
      });
      const fixture = TestBed.createComponent(Saludo);
      await fixture.whenStable();
      expect(fixture.nativeElement.textContent).toContain('Hola, Ada');
    });
  });
lines:
  - "    const sesionFalsa = { nombre: signal('Ada') };"
  - '    TestBed.configureTestingModule({'
  - '      providers: [{ provide: Sesion, useValue: sesionFalsa }],'
  - '    });'
  - '    const fixture = TestBed.createComponent(Saludo);'
  - '    await fixture.whenStable();'
  - "    expect(fixture.nativeElement.textContent).toContain('Hola, Ada');"
distractors:
  - '      providers: [{ provide: sesionFalsa, useValue: Sesion }],'
  - '    const sesionFalsa = new Sesion();'
hints:
  - 'La idea: primero preparas el doble, después le dices al inyector de prueba que lo use, luego creas el componente, esperas a que pinte y compruebas el texto.'
  - 'Qué usar: un objeto con una signal `nombre`, `TestBed.configureTestingModule` con un proveedor `{ provide: TokenReal, useValue: doble }`, `TestBed.createComponent` y `whenStable`.'
  - 'El plan: doble → configureTestingModule (con su línea de providers y su cierre) → createComponent → await whenStable → expect. Hay que configurar antes de crear el componente.'
tests:
  - output: |
      ✓ Saludo > usa el nombre de la sesión
    sample: true
