questions:
- type: choice
  prompt: ¿Qué librería trae `@Component`, `signal` e `inject`?
  options:
  - '`@angular/common`'
  - '`@angular/core`'
  - '`@angular/platform-browser`'
  - '`rxjs`'
  answer: 1
  explanation: '`@angular/core` es el corazón de Angular: componentes, signals, inyección de dependencias y ciclo de vida. `platform-browser` trae `bootstrapApplication`; `common`, los pipes y HttpClient.'
- type: choice
  prompt: ¿Por qué `vitest` y `jsdom` están en `devDependencies`?
  options:
  - Porque son librerías experimentales
  - Porque solo sirven para ejecutar las pruebas en tu ordenador; no viajan al navegador del usuario
  - Porque se descargan solo cuando ejecutas `ng build`
  answer: 1
  explanation: Vitest ejecuta las pruebas y jsdom simula el DOM dentro de Node.js para que esas pruebas puedan pintar componentes. Son herramientas de desarrollo, como `typescript` o `@angular/cli`.
- type: choice
  prompt: '`npm install` descarga unos 400 paquetes y 300 MB. ¿Cuánto de eso llega al navegador?'
  options:
  - Solo el código que tu aplicación importa, ya minimizado (unos 216 kB en la app de bienvenida)
  - Los 300 MB, la primera vez que se abre la página
  - Todas las `dependencies` completas, pero ninguna `devDependency`
  answer: 0
  explanation: 'El build sigue los `import` desde `main.ts`, descarta lo que no se usa (tree shaking) y minimiza el resto. La lista de `dependencies` no decide el tamaño final: lo deciden tus imports.'
