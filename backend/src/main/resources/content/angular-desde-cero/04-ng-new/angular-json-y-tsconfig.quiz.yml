questions:
- type: choice
  prompt: ¿Qué configuración usa `ng build` si no le dices ninguna?
  options:
  - '`development`, porque es la más rápida'
  - '`production`, porque es la `defaultConfiguration` del target `build`'
  - Ninguna; hay que escribir siempre `--configuration`
  answer: 1
  explanation: 'En `angular.json`, el target `build` tiene `"defaultConfiguration": "production"`. El target `serve`, en cambio, usa `development` por defecto.'
- type: choice
  prompt: 'En `angular.json`, ¿qué indica `"browser": "src/main.ts"`?'
  options:
  - El punto de entrada desde el que el empaquetador sigue todos los imports
  - El navegador en el que se abrirá la app
  - El archivo HTML que se envía al navegador
  answer: 0
  explanation: El build empieza en `main.ts` y recorre cada `import` para reunir todo el código de la app. El HTML es `src/index.html`.
- type: choice
  prompt: ¿Por qué en un archivo `.spec.ts` puedes usar `describe` e `it` sin importarlos?
  options:
  - Porque `describe` e `it` son parte de JavaScript
  - Porque `@angular/core` los exporta automáticamente
  - Porque `tsconfig.spec.json` añade los tipos globales `vitest/globals`
  answer: 2
  explanation: '`"types": ["vitest/globals"]` en `tsconfig.spec.json` hace que TypeScript conozca esas funciones globales de Vitest. `tsconfig.app.json` no las incluye, porque la app no las necesita.'
