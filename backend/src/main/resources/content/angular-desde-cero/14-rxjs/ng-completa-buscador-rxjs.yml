title: El buscador que no satura
summary: Completa la tubería de un buscador con debounceTime, distinctUntilChanged y switchMap.
difficulty: MEDIUM
kind: fill
statement: |
  Este buscador de libros debe:

  1. Esperar a que la persona deje de teclear **300 ms** antes de buscar.
  2. No repetir la búsqueda si el texto es **igual al anterior**.
  3. Lanzar la petición y **cancelar la anterior** si llega un texto nuevo.

  Completa los tres operadores, en ese orden. Si busca «dune» y la API devuelve un libro, la página muestra:

  ```text
  Dune
  ```
starter: |
