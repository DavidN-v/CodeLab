title: Recupera el tema sin romper el servidor
summary: Ordena las líneas de un componente que lee localStorage solo en el navegador.
difficulty: MEDIUM
kind: parsons
statement: |
  El componente `SelectorTema` muestra el tema elegido (`claro` u `oscuro`). Al pulsar el botón lo cambia y lo guarda en `localStorage`. Al cargar, debe recuperar el tema guardado **sin fallar en el servidor**, donde `localStorage` no existe.

  El servidor siempre renderiza `Tema: claro`; un instante después de hidratar, el navegador muestra el tema guardado.

  Ordena las líneas de la clase. Cuidado: hay líneas que sobran.
