title: Carga con espera
summary: Ordena una función async que espera un dato y maneja el error.
difficulty: HARD
kind: parsons
statement: |
  `buscarProducto` simula un servidor: tarda medio segundo y devuelve la gorra si el `id` es 1, o falla si no existe. Completa `mostrarProducto` para que **espere** el producto y escriba `nombre: precio €`; si la búsqueda falla, debe escribir `No se pudo cargar el producto`.

  Con `mostrarProducto(1)` la consola muestra:

  ```text
  Cargando…
  Gorra: 15 €
  ```

  Ordena las líneas. Cuidado: algunas sobran.
starter: |
  interface Producto {
    nombre: string;
    precio: number;
  }

  function buscarProducto(id: number): Promise<Producto> {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if (id === 1) {
          resolve({ nombre: 'Gorra', precio: 15 });
        } else {
          reject(new Error('No existe'));
        }
      }, 500);
    });
  }

  async function mostrarProducto(id: number): Promise<void> {
    console.log('Cargando…');
  {{lines}}
  }

  mostrarProducto(1);
