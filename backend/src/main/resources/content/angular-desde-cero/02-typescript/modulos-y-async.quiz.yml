questions:
  - type: choice
    prompt: ¿De dónde sale `Component` en esta línea?
    code: |
      import { Component } from '@angular/core';
    options:
      - De un archivo `core.ts` en la misma carpeta que el componente
      - Del paquete `@angular/core`, instalado en `node_modules`
      - De internet, cada vez que se abre la página
    answer: 1
    explanation: 'La ruta no empieza por `./` ni `../`, así que es un paquete instalado en `node_modules`. `@angular/core` es la librería principal de Angular.'
  - type: choice
    prompt: En `utilidades.ts` hay `function formatear() {...}` sin `export`. ¿Qué pasa si otro archivo hace `import { formatear } from './utilidades';`?
    options:
      - Funciona, porque todas las funciones son públicas
      - TypeScript da un error, porque `formatear` no se exporta
      - Se importa, pero vale `undefined`
    answer: 1
    explanation: 'Cada archivo es un módulo cerrado: solo se puede importar lo que lleva `export`. Lo demás es privado del archivo.'
  - type: choice
    prompt: ¿Qué significa que una ruta de import empiece por `../`?
    options:
      - Es un archivo en la carpeta de arriba
      - Es un paquete de `node_modules`
      - Es un archivo en la misma carpeta
    answer: 0
    explanation: '`./` es la misma carpeta y `../` es la carpeta de arriba. Sin punto inicial sería un paquete.'
