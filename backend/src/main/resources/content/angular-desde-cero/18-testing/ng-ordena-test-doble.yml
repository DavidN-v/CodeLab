title: Un componente con un carrito de mentira
summary: Ordena una prueba que usa un doble para comprobar que el componente delega.
difficulty: MEDIUM
kind: parsons
statement: |
  `ResumenCarrito` muestra el total y tiene un botón «Vaciar» que llama a `carrito.vaciar()`. La prueba ya sustituye el servicio real por `carritoFalso`. Ordena las líneas del `it` para que:

  1. Cree el componente.
  2. Espere a que Angular lo pinte.
  3. Pulse el botón.
  4. Compruebe que el doble recibió **una** llamada a `vaciar`.

  Cuidado: dos líneas sobran.
