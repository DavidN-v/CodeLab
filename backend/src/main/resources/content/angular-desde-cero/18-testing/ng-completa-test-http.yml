title: Un servidor de mentira para LibrosApi
summary: Completa una prueba de HTTP con provideHttpClientTesting y HttpTestingController.
difficulty: HARD
kind: fill
statement: |
  `LibrosApi` tiene un método `listar()` que hace `GET /api/libros`. Completa la prueba para que no use la red real:

  1. La ruta del paquete de Angular con las herramientas de prueba de HTTP.
  2. La función que cambia la red real por una falsa (en `providers`).
  3. La clase que controla ese servidor falso (para pedirla a `TestBed`).
  4. El método que comprueba que hay **exactamente una** petición a esa URL.
  5. El método que **responde** a la petición con datos.
  6. El método que, al final de cada prueba, comprueba que no quedó **ninguna petición pendiente**.
