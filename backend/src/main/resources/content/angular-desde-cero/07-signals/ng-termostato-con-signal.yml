title: Termostato con signal
summary: Completa la creación de un signal y sus dos formas de cambiarlo.
difficulty: EASY
kind: fill
statement: |
  Un termostato empieza en 20 °C. El botón **+** sube un grado a partir de la temperatura actual y **Apagar** la pone directamente a 0.

  Completa los huecos: importa lo necesario, crea el signal y usa el método adecuado en cada botón. Tras pulsar **+** dos veces, la página muestra lo que indica el resultado esperado.
