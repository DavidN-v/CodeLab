title: Ordena el selector de talla
summary: Ordena la clase de un componente que usa signal y linkedSignal.
difficulty: MEDIUM
kind: parsons
statement: |
  Un selector de talla muestra un botón por talla. La talla elegida empieza siendo la primera de la lista y la persona puede cambiarla. Si la tienda cambia la lista de tallas, la elegida vuelve a ser la primera de la lista nueva.

  Ordena las líneas de la clase en este orden: primero los dos signals (la lista y la talla elegida), después el método `elegir` y por último `soloGrandes`. Cuidado: alguna línea sobra.

  Si eliges **M** y luego pulsas **Ver tallas grandes**, se ve lo que indica el resultado esperado.
