title: La página que coordina
summary: Ordena las líneas de un componente contenedor que junta API, estado y presentación.
difficulty: MEDIUM
kind: parsons
statement: |
  `CatalogoPage` es el contenedor del catálogo:

  - pide los productos a `ProductosApi` (su método `listar()` devuelve un observable) y los convierte en un signal que empieza como lista vacía;
  - usa `CarritoStore` para mostrar el total y para añadir productos;
  - cuando una `TarjetaProducto` emite `anadir`, añade ese producto al carrito.

  La plantilla ya está escrita. Ordena las líneas de la clase. Cuidado: hay líneas que sobran.
