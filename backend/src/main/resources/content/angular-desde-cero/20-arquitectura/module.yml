    title: Seguridad en el frontend
    summary: XSS, sanitización, innerHTML, bypassSecurityTrust, CSRF y por qué no hay secretos en el navegador.
    minutes: 9
  - slug: i18n-y-equipos
    title: Varios idiomas y equipos grandes
    summary: '@angular/localize en panorama y prácticas para escalar un equipo.'
    minutes: 7
