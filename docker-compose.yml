name: forja

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forja}
      POSTGRES_USER: ${POSTGRES_USER:-forja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: lets a locally running backend or a SQL client connect.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-forja}
      POSTGRES_USER: ${POSTGRES_USER:-forja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      CODE_RUNNER_URL: http://code-runner:8090
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      code-runner:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - edge
      - data
      - runner

  # Deliberately the least connected service: no published ports, no access to
  # the database, and a network with no route to the internet. Only the backend
  # can reach it. It never runs user code itself: every execution gets a
  # throwaway sandbox-java container, created through docker-proxy.
  code-runner:
    build: ./code-runner
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCKER_API_URL: http://docker-proxy:2375
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-2}
    depends_on:
      docker-proxy:
        condition: service_started
      sandbox-java:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - runner

  # The only service that touches the Docker socket. It forwards container and
  # image requests from the runner and refuses the rest of the Docker API
  # (exec, build, networks, volumes, swarm...).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      # IPv4 only: the default also binds IPv6 and fails where Docker has it disabled.
      DISABLE_IPV6: 1
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - runner

  # Build-only: produces the image every Java execution runs in, then exits.
  # Containers from it get no network, a read-only root and no capabilities.
  sandbox-java:
    build: ./code-runner/sandbox/java
    image: forja-sandbox-java:21
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only and localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge

networks:
  edge:
  data:
  runner:
    internal: true

volumes:
  postgres-data:
