<div class="fill">
  <p class="fill__status">{{ filled() }} de {{ blankCount() }} huecos rellenos</p>
  <div class="fill__code" role="group" aria-label="Programa con huecos">
    @for (line of lines(); track $index; let lineIndex = $index) {
      <div class="fill__line">
        <span class="fill__number" aria-hidden="true">{{ lineIndex + 1 }}</span>
        @for (segment of line; track $index) {
          <span class="fill__text">{{ segment.text }}</span>
          @if (segment.blank !== null) {
            <input
              class="fill__blank"
              type="text"
              spellcheck="false"
              autocomplete="off"
              [attr.aria-label]="'Hueco ' + (segment.blank + 1)"
              [style.width.ch]="width(segment.blank)"
              [value]="answer(segment.blank)"
              (input)="onInput(segment.blank, $event)"
            />
          }
        }
      </div>
    }
  </div>
</div>
