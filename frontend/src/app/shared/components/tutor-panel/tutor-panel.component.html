@if (enabled()) {
  <section class="tutor" aria-label="Tutor">
    @if (heading()) {
      <h2 class="tutor__heading">{{ heading() }}</h2>
    }
    <div class="tutor__ask">
      @if (withQuestion()) {
        <input
          class="tutor__question"
          type="text"
          maxlength="500"
          placeholder="¿Qué no te ha quedado claro? (opcional)"
          [value]="question()"
          (input)="onQuestion($event)"
          (keydown.enter)="request()"
        />
      }
      <button
        type="button"
        class="button button--secondary button--small"
        [disabled]="loading()"
        (click)="request()"
      >
        <span aria-hidden="true">✦</span> {{ loading() ? 'El tutor está pensando…' : label() }}
      </button>
    </div>
    @if (hint() && !answer()) {
      <p class="tutor__hint">{{ hint() }}</p>
    }
    @if (answer(); as text) {
      <div class="tutor__answer" aria-live="polite">
        <p class="tutor__by">✦ Tutor</p>
        <app-markdown [content]="text" />
      </div>
    }
  </section>
}
