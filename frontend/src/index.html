<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Forja</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Aprende a programar construyendo: conceptos, código real y ejercicios que se ejecutan en el navegador."
    />
    <meta name="theme-color" content="#131210" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // The saved theme, applied before the first paint so the page does not flash.
      try {
        var theme = localStorage.getItem('forja.theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
